# 논문 위키 자동 업데이트 (GitHub 서버에서 실행 — 맥북 상태와 무관)
#  - 매주 월요일 오전 9시(한국 시간): 새 논문 수집 → 위키 반영 → 웹페이지 갱신 → 다이제스트 알림
#  - 맥북 Obsidian에서 고친 내용이 올라오면: 교정 요청 반영 + 웹페이지 갱신
#  - Actions 탭의 "Run workflow" 버튼으로 주간 실행을 언제든 수동 실행 가능
name: 주간 논문 위키 업데이트

on:
  schedule:
    - cron: "0 0 * * 1"   # UTC 월요일 00:00 = 한국 시간 월요일 09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["obsidian_notes/**"]

permissions:
  contents: write
  pages: write
  issues: write

concurrency:
  group: vet-wiki
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 도구 설치
        run: |
          python3 -m pip install -q -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: git 사용자 설정
        run: |
          git config user.name "vet-wiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 구독 토큰 준비
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=구독 토큰 없음::Settings → Secrets and variables → Actions 에 CLAUDE_CODE_OAUTH_TOKEN 을 등록하세요."
            exit 1
          fi
          printf '%s' "$TOKEN" > claude_token.txt

      - name: 주간 실행 (논문 수집 → 위키 반영 → 웹페이지 → 다이제스트)
        if: github.event_name != 'push'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/website/
        run: bash run_weekly.sh

      - name: 맥북에서 고친 내용 반영 (교정 요청 · 별표)
        if: github.event_name == 'push'
        run: bash run_on_push.sh

      - name: 처리 기록 저장
        if: always()
        run: |
          rm -f claude_token.txt
          git add -A
          git diff --cached --quiet || git commit -q -m "처리 기록 갱신 $(date +%F)"
          git pull --rebase -q || true
          git push || true

      - name: 다이제스트 알림 (GitHub 알림·이메일로 전달)
        if: always() && hashFiles('data/digest_issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --title "$(cat data/digest_issue_title.txt)" --body-file data/digest_issue.md)
          echo "다이제스트: $url"
          gh issue close "$url" > /dev/null || true

      - name: 웹페이지 다시 게시
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
