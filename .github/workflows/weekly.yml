# 매주 월요일 오전 9시(한국 시간)에 GitHub 서버에서 논문 위키를 업데이트합니다.
# 맥북이 꺼져 있거나 닫혀 있어도 돌아갑니다.
# Actions 탭에서 "Run workflow" 버튼으로 언제든 수동 실행도 가능합니다.
name: 주간 논문 위키 업데이트

on:
  schedule:
    - cron: "0 0 * * 1"   # UTC 월요일 00:00 = 한국 시간 월요일 09:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: vet-wiki
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 도구 설치
        run: |
          python3 -m pip install -q -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: git 사용자 설정
        run: |
          git config user.name "vet-wiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 구독 토큰 준비
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN 시크릿이 등록되지 않았습니다."
            exit 1
          fi
          printf '%s' "$TOKEN" > claude_token.txt

      - name: 주간 실행 (논문 수집 → 위키 반영 → 웹페이지 갱신)
        run: bash run_weekly.sh

      - name: 처리 기록 저장
        if: always()
        run: |
          rm -f claude_token.txt
          git add -A
          git diff --cached --quiet || git commit -q -m "처리 기록 갱신 $(date +%F)"
          git push || true

      - name: 웹페이지 다시 게시
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
