<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수의영상의학 논문 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f5;
    --ink: #172026;
    --ink-muted: #5b6570;
    --ink-faint: #8b939a;
    --line: #dadfe1;
    --accent: #2b6e6a;
    --accent-tint: #e4efee;
    --amber: #a8752e;
    --amber-tint: #fbf3e7;
    --focus: #2b6e6a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  /* ── 마스트헤드 ── */
  header.masthead {
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }

  header.masthead h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: clamp(28px, 5vw, 36px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .masthead-meta {
    color: var(--ink-faint);
    font-size: 13px;
  }

  /* ── 보기 전환 탭 (논문 / 주제) ── */
  .view-tabs {
    display: flex;
    gap: 4px;
    margin-top: 18px;
  }

  .view-tab {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-muted);
    background: none;
    border: none;
    padding: 8px 4px;
    margin-right: 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .view-tab.active {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 검색 ── */
  .search-row {
    margin: 28px 0 16px;
  }

  #searchBox {
    width: 100%;
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #searchBox::placeholder { color: var(--ink-faint); }

  /* ── 주제 필터 필 ── */
  .topic-row-wrap {
    position: relative;
    margin-bottom: 32px;
  }

  .topic-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  .topic-row::-webkit-scrollbar { height: 6px; }
  .topic-row::-webkit-scrollbar-track { background: transparent; }
  .topic-row::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 999px;
  }
  .topic-row::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

  /* 오른쪽에 더 있다는 걸 흐릿하게 알려주는 그라데이션 */
  .topic-row-wrap::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 8px;
    width: 32px;
    background: linear-gradient(to right, transparent, var(--bg));
    pointer-events: none;
  }
  .topic-row-wrap.at-end::after { opacity: 0; }

  .pill {
    flex: none;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .pill:hover { border-color: var(--accent); color: var(--accent); }

  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── 논문 목록 ── */
  .entry {
    padding: 28px 0;
    border-top: 1px solid var(--line);
  }
  .entry:first-child { border-top: none; padding-top: 0; }

  .entry-meta {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }

  .entry h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 21px;
    line-height: 1.35;
    margin: 0 0 12px;
  }

  .entry h2 a { color: var(--ink); text-decoration: none; }
  .entry h2 a:hover { color: var(--accent); }

  .summary-ko { margin-bottom: 8px; }
  .summary-en { color: var(--ink-muted); font-size: 14.5px; margin-bottom: 14px; }

  .takeaway {
    border-left: 3px solid var(--amber);
    background: var(--amber-tint);
    padding: 10px 14px;
    font-size: 14.5px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 14px;
  }

  .entry-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    font-size: 12.5px;
    color: var(--accent);
    background: var(--accent-tint);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .entry-link { font-size: 13.5px; white-space: nowrap; }

  .study-badge {
    display: inline-block;
    font-size: 12px;
    color: var(--ink-muted);
    border: 1px solid var(--line);
    padding: 1px 8px;
    border-radius: 4px;
    margin-left: 6px;
  }

  /* ── 주제(topics) 보기 ── */
  .topic-entry {
    padding: 28px 0;
    border-top: 1px solid var(--line);
  }
  .topic-entry:first-child { border-top: none; padding-top: 0; }

  .topic-entry h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 4px;
  }

  .topic-count {
    font-size: 13px;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  .topic-synthesis {
    margin-bottom: 14px;
  }

  .sub-heading {
    font-size: 15.5px;
    font-weight: 600;
    margin: 18px 0 6px;
    color: var(--ink);
  }

  .study-badge.fulltext {
    color: var(--accent);
    border-color: var(--accent);
  }

  .open-box {
    border-left: 3px solid var(--accent);
    background: var(--accent-tint);
    padding: 10px 14px;
    font-size: 14.5px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 14px;
  }

  .conflict-box {
    border-left: 3px solid var(--amber);
    background: var(--amber-tint);
    padding: 10px 14px;
    font-size: 14.5px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 14px;
  }

  .related-list {
    margin: 0;
    padding-left: 20px;
    color: var(--ink-muted);
    font-size: 14px;
  }
  .related-list li { margin-bottom: 4px; }

  /* ── 빈 상태 ── */
  #empty {
    color: var(--ink-muted);
    text-align: center;
    padding: 48px 0;
    display: none;
  }

  @media (max-width: 480px) {
    .page { padding: 32px 16px 64px; }
    .entry-footer { align-items: flex-start; flex-direction: column; }
  }

  /* ── v3: 필터·정렬·접힘 목록·나중에 볼 논문 ── */
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .filter-grid select, .sort-select {
    width: 100%;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .filter-grid select.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .star-filter {
    font-family: inherit;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-muted);
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .star-filter.on { background: var(--amber-tint); border-color: var(--amber); color: var(--amber); font-weight: 600; }
  .reset-link {
    font-size: 13px; color: var(--ink-faint); background: none; border: none;
    cursor: pointer; text-decoration: underline; font-family: inherit; padding: 0;
  }
  .result-count { font-size: 13px; color: var(--ink-faint); }
  .sort-select { width: auto; }

  .month-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    padding: 18px 0 6px;
    border-bottom: 1px solid var(--line);
  }

  .entry { padding: 18px 0; }
  .entry-head { display: flex; gap: 12px; align-items: flex-start; }
  .entry-main { flex: 1; min-width: 0; }
  .entry h2 { font-size: 18.5px; margin: 0 0 8px; }
  .entry-toggle {
    all: unset;
    cursor: pointer;
    font-family: 'Newsreader', serif;
    font-weight: 500;
    color: var(--ink);
  }
  .entry-toggle:hover { color: var(--accent); }
  .entry-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .entry .takeaway { margin-bottom: 0; }
  .entry-detail { display: none; margin-top: 14px; }
  .entry.open .entry-detail { display: block; }
  .expand-hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; }
  .entry.open .expand-hint { display: none; }

  .star-btn {
    flex: none;
    font-size: 22px;
    line-height: 1;
    background: none;
    border: none;
    color: var(--line);
    cursor: pointer;
    padding: 2px 4px;
  }
  .star-btn.on { color: var(--amber); }
  .star-btn:hover { color: var(--amber); }

  .more-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .more-btn:hover { border-color: var(--accent); color: var(--accent); }

  .topic-link-btn {
    font-family: inherit;
    font-size: 13.5px;
    color: var(--accent);
    background: none;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    margin-top: 6px;
  }
  .topic-link-btn:hover { background: var(--accent-tint); }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <h1>수의영상의학 논문 아카이브</h1>
    <div class="masthead-meta" id="mastMeta">불러오는 중...</div>
    <div class="view-tabs">
      <button class="view-tab active" data-view="papers">논문</button>
      <button class="view-tab" data-view="topics">주제</button>
    </div>
  </header>

  <div id="papersView">
    <div class="search-row">
      <input id="searchBox" type="text" placeholder="제목, 저널, 요약, 키워드로 검색...">
    </div>

    <div class="filter-grid" id="filterGrid"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="star-filter" id="starFilter">★ 나중에 볼 논문</button>
        <span class="result-count" id="resultCount"></span>
        <button class="reset-link" id="resetBtn">필터 초기화</button>
      </div>
      <select class="sort-select" id="sortSelect" aria-label="정렬">
        <option value="added">최근 등록순</option>
        <option value="year">출판연도순</option>
        <option value="title">제목순</option>
      </select>
    </div>

    <div id="paperList"></div>
    <div id="empty">표시할 논문이 없습니다. 검색어나 필터를 바꿔보세요.</div>
    <button class="more-btn" id="moreBtn" style="display:none;"></button>
  </div>

  <div id="topicsView" style="display:none;">
    <div id="topicsList"></div>
    <div id="topicsEmpty" style="display:none; color:var(--ink-muted); text-align:center; padding:48px 0;">
      아직 정리된 주제가 없습니다. 논문이 몇 편 더 쌓이면 여기에 주제별 종합이 나타납니다.
    </div>
  </div>
</div>

<script>
  // 이 부분은 build_site.py가 실행될 때마다 data/papers.json,
  // data/topics.json 내용으로 자동으로 교체됩니다. 직접 손으로 수정하지 마세요.
  let allPapers = /*__PAPERS_JSON__*/ [];
  let allTopics = /*__TOPICS_JSON__*/ [];

  const PAGE_SIZE = 20;
  const STAR_KEY = "vetwiki-read-later";

  // 필터 정의: [논문 데이터의 필드, 드롭다운 제목, 보기 좋은 이름표]
  const TOPIC_NAMES = Object.fromEntries(allTopics.map(t => [t.slug, t.title]));
  const FILTERS = [
    { key: "topics", label: "주제", names: TOPIC_NAMES },
    { key: "modality", label: "영상 기법", names: {
        radiography: "방사선", CT: "CT", MRI: "MRI", ultrasound: "초음파",
        echocardiography: "심초음파", fluoroscopy: "투시", "nuclear-medicine": "핵의학",
        "contrast-study": "조영검사", interventional: "중재" } },
    { key: "system", label: "계통", names: {
        neuro: "신경", spine: "척추", "head-neck": "두경부", dental: "치과", thorax: "흉부",
        cardiovascular: "심혈관", abdomen: "복부", hepatobiliary: "간담도",
        gastrointestinal: "소화기", urogenital: "비뇨생식", endocrine: "내분비",
        musculoskeletal: "근골격", oncology: "종양", trauma: "외상",
        technique: "촬영 기법", "sedation-restraint": "진정·보정", AI: "AI" } },
    { key: "species", label: "종", names: { dog: "개", cat: "고양이", rabbit: "토끼" } },
    { key: "study_type", label: "연구 유형", names: {} },
  ];

  const state = { query: "", filters: {}, starOnly: false, sort: "added", shown: PAGE_SIZE, open: new Set() };

  // ── 나중에 볼 논문 (이 브라우저에 저장) ──
  function loadStars() {
    try { return new Set(JSON.parse(localStorage.getItem(STAR_KEY) || "[]")); }
    catch (e) { return new Set(); }
  }
  let stars = loadStars();
  function saveStars() {
    try { localStorage.setItem(STAR_KEY, JSON.stringify([...stars])); } catch (e) {}
  }

  // ── 도우미 ──
  function esc(text) {
    return String(text ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function asList(v) { return Array.isArray(v) ? v : (v ? [v] : []); }
  function shortJournal(j) { return (j || "").split(" : ")[0]; }
  function nameOf(filter, value) { return filter.names[value] || value; }

  document.getElementById("mastMeta").textContent =
    allPapers.length > 0
      ? `총 ${allPapers.length}편 수록 · 주제 ${allTopics.length}개 · 최근 갱신 ${allPapers[0].added_on || ""}`
      : "아직 수록된 논문이 없습니다";

  // ── 필터 드롭다운 만들기 (실제 데이터에 있는 값만, 논문 수와 함께) ──
  function buildFilters() {
    const grid = document.getElementById("filterGrid");
    grid.innerHTML = "";
    FILTERS.forEach(f => {
      const counts = {};
      allPapers.forEach(p => asList(p[f.key]).forEach(v => { counts[v] = (counts[v] || 0) + 1; }));
      const values = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      if (values.length === 0) return;
      const sel = document.createElement("select");
      sel.setAttribute("aria-label", f.label);
      sel.innerHTML = `<option value="">${f.label}: 전체</option>` +
        values.map(v => `<option value="${esc(v)}">${esc(nameOf(f, v))} (${counts[v]})</option>`).join("");
      sel.value = state.filters[f.key] || "";
      sel.classList.toggle("on", !!sel.value);
      sel.addEventListener("change", () => {
        state.filters[f.key] = sel.value;
        sel.classList.toggle("on", !!sel.value);
        state.shown = PAGE_SIZE;
        render();
      });
      grid.appendChild(sel);
    });
  }

  function updateStarButton() {
    const btn = document.getElementById("starFilter");
    btn.textContent = `★ 나중에 볼 논문 (${stars.size})`;
    btn.classList.toggle("on", state.starOnly);
  }

  // ── 필터링·정렬 ──
  function filtered() {
    const q = state.query;
    let list = allPapers.filter(p => {
      for (const f of FILTERS) {
        const want = state.filters[f.key];
        if (want && !asList(p[f.key]).includes(want)) return false;
      }
      if (state.starOnly && !stars.has(p.pmid)) return false;
      if (!q) return true;
      return [p.title, p.journal, p.summary_ko, p.summary_en, p.clinical_takeaway_ko,
              ...(p.tags || []), ...(p.authors || [])]
        .some(t => (t || "").toLowerCase().includes(q));
    });
    const by = {
      added: (a, b) => (b.added_on || "").localeCompare(a.added_on || "") || b.pmid.localeCompare(a.pmid),
      year: (a, b) => (b.year || "").localeCompare(a.year || "") || (b.added_on || "").localeCompare(a.added_on || ""),
      title: (a, b) => (a.title || "").localeCompare(b.title || ""),
    };
    return list.sort(by[state.sort]);
  }

  function entryHtml(p) {
    const starred = stars.has(p.pmid);
    const isOpen = state.open.has(p.pmid);
    const badges =
      (p.study_type ? `<span class="study-badge">${esc(p.study_type)}${p.sample_size ? `, n=${esc(p.sample_size)}` : ""}</span>` : "") +
      (p.evidence_basis === "fulltext" ? `<span class="study-badge fulltext">전문 검토</span>` : "");
    return `
      <article class="entry${isOpen ? " open" : ""}" data-pmid="${esc(p.pmid)}">
        <div class="entry-head">
          <div class="entry-main">
            <div class="entry-meta">${esc(shortJournal(p.journal))} · ${esc(p.year)}${badges}</div>
            <h2><button class="entry-toggle" data-action="toggle" title="눌러서 요약 펼치기">${esc(p.title)}</button></h2>
            ${p.clinical_takeaway_ko ? `<div class="takeaway">${esc(p.clinical_takeaway_ko)}</div>` : ""}
            <div class="entry-detail">
              <div class="entry-meta">${esc((p.authors || []).join(", "))}</div>
              ${p.summary_ko ? `<div class="summary-ko">${esc(p.summary_ko)}</div>` : ""}
              ${p.summary_en ? `<div class="summary-en">${esc(p.summary_en)}</div>` : ""}
              <div class="entry-footer">
                <div class="tags">${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
                <a class="entry-link" href="${esc(p.url)}" target="_blank" rel="noopener">PubMed에서 보기</a>
              </div>
            </div>
          </div>
          <button class="star-btn${starred ? " on" : ""}" data-action="star"
            aria-label="${starred ? "나중에 볼 논문에서 빼기" : "나중에 볼 논문으로 표시"}">${starred ? "★" : "☆"}</button>
        </div>
      </article>`;
  }

  function render() {
    updateStarButton();
    const list = filtered();
    const shown = list.slice(0, state.shown);
    const listEl = document.getElementById("paperList");
    const empty = document.getElementById("empty");
    const more = document.getElementById("moreBtn");

    document.getElementById("resultCount").textContent =
      list.length === allPapers.length ? `${list.length}편` : `${allPapers.length}편 중 ${list.length}편`;

    empty.style.display = list.length === 0 ? "block" : "none";

    // 최근 등록순일 때는 등록 월별로 구분선을 넣습니다
    let html = "", lastMonth = null;
    shown.forEach(p => {
      if (state.sort === "added") {
        const m = (p.added_on || "").slice(0, 7);
        if (m && m !== lastMonth) {
          const [y, mo] = m.split("-");
          const n = list.filter(x => (x.added_on || "").startsWith(m)).length;
          html += `<div class="month-heading">${y}년 ${Number(mo)}월 등록 · ${n}편</div>`;
          lastMonth = m;
        }
      }
      html += entryHtml(p);
    });
    listEl.innerHTML = html;

    const remaining = list.length - shown.length;
    more.style.display = remaining > 0 ? "block" : "none";
    more.textContent = `더 보기 (${remaining}편 남음)`;
  }

  // ── 이벤트 ──
  document.getElementById("paperList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const pmid = btn.closest(".entry").dataset.pmid;
    if (btn.dataset.action === "toggle") {
      state.open.has(pmid) ? state.open.delete(pmid) : state.open.add(pmid);
      btn.closest(".entry").classList.toggle("open");
    } else if (btn.dataset.action === "star") {
      stars.has(pmid) ? stars.delete(pmid) : stars.add(pmid);
      saveStars();
      render();
    }
  });

  document.getElementById("searchBox").addEventListener("input", (e) => {
    state.query = e.target.value.trim().toLowerCase();
    state.shown = PAGE_SIZE;
    render();
  });
  document.getElementById("sortSelect").addEventListener("change", (e) => {
    state.sort = e.target.value;
    render();
  });
  document.getElementById("starFilter").addEventListener("click", () => {
    state.starOnly = !state.starOnly;
    state.shown = PAGE_SIZE;
    render();
  });
  document.getElementById("moreBtn").addEventListener("click", () => {
    state.shown += PAGE_SIZE;
    render();
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    state.query = ""; state.filters = {}; state.starOnly = false; state.shown = PAGE_SIZE;
    document.getElementById("searchBox").value = "";
    buildFilters();
    render();
  });

  // ── 보기 전환 (논문 / 주제) ──
  function showView(view) {
    document.querySelectorAll(".view-tab").forEach(b => b.classList.toggle("active", b.dataset.view === view));
    document.getElementById("papersView").style.display = view === "papers" ? "" : "none";
    document.getElementById("topicsView").style.display = view === "topics" ? "" : "none";
    if (view === "topics") renderTopics();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".view-tab").forEach(btn =>
    btn.addEventListener("click", () => showView(btn.dataset.view)));

  // ── 주제 탭 ──
  function isMeaningfulText(text) {
    if (!text) return false;
    const trimmed = text.trim();
    if (trimmed.length === 0) return false;
    return !/^[(（]?(아직\s*)?없음[)）]?$/.test(trimmed);
  }

  function mdToHtml(text) {
    // 가벼운 마크다운 변환: ### 소제목, **굵게**, [[위키 링크]], 목록, 줄바꿈
    return esc(text)
      .replace(/\[\[[^\]|]*\|([^\]]+)\]\]/g, "$1")
      .replace(/\[\[(?:[^\]]*\/)?([^\]]+)\]\]/g, "$1")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/^###\s+(.+)$/gm, '<h3 class="sub-heading">$1</h3>')
      .replace(/^-\s+(.+)$/gm, "• $1")
      .replace(/\n{2,}/g, "<br><br>")
      .replace(/\n/g, "<br>")
      .replace(/(<\/h3>)(<br>)+/g, "$1")
      .replace(/(<br>)+(<h3)/g, "$2");
  }

  function renderTopics() {
    const list = document.getElementById("topicsList");
    const empty = document.getElementById("topicsEmpty");
    if (allTopics.length === 0) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    list.innerHTML = allTopics.map(t => {
      const n = allPapers.filter(p => asList(p.topics).includes(t.slug)).length;
      return `
      <article class="topic-entry">
        <h2>${esc(t.title)}</h2>
        <div class="topic-count">관련 논문 ${n || t.paper_count}편</div>
        ${isMeaningfulText(t.synthesis) ? `<div class="topic-synthesis">${mdToHtml(t.synthesis)}</div>` : ""}
        ${isMeaningfulText(t.conflicting_evidence) ? `<div class="conflict-box"><strong>상충되는 근거</strong><br>${mdToHtml(t.conflicting_evidence)}</div>` : ""}
        ${isMeaningfulText(t.open_questions) ? `<div class="open-box"><strong>남은 질문</strong><br>${mdToHtml(t.open_questions)}</div>` : ""}
        ${n > 0 ? `<button class="topic-link-btn" data-topic="${esc(t.slug)}">이 주제의 논문 ${n}편 보기 →</button>` : ""}
      </article>`;
    }).join("");
  }

  document.getElementById("topicsList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.filters = { topics: btn.dataset.topic };
    state.query = ""; state.starOnly = false; state.shown = PAGE_SIZE;
    document.getElementById("searchBox").value = "";
    buildFilters();
    render();
    showView("papers");
  });

  buildFilters();
  render();
</script>

</body>
</html>
