<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수의영상의학 논문 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f6f5;
    --ink: #172026;
    --ink-muted: #5b6570;
    --ink-faint: #8b939a;
    --line: #dadfe1;
    --accent: #2b6e6a;
    --accent-tint: #e4efee;
    --amber: #a8752e;
    --amber-tint: #fbf3e7;
    --focus: #2b6e6a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }

  /* ── 마스트헤드 ── */
  header.masthead {
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
    margin-bottom: 24px;
  }

  header.masthead h1 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: clamp(28px, 5vw, 36px);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .masthead-meta {
    color: var(--ink-faint);
    font-size: 13px;
  }

  /* ── 보기 전환 탭 (논문 / 주제) ── */
  .view-tabs {
    display: flex;
    gap: 4px;
    margin-top: 18px;
  }

  .view-tab {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-muted);
    background: none;
    border: none;
    padding: 8px 4px;
    margin-right: 18px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }

  .view-tab.active {
    color: var(--ink);
    font-weight: 600;
    border-bottom-color: var(--accent);
  }

  /* ── 검색 ── */
  .search-row {
    margin: 28px 0 16px;
  }

  #searchBox {
    width: 100%;
    padding: 11px 14px;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
  }

  #searchBox::placeholder { color: var(--ink-faint); }

  /* ── 주제 필터 필 ── */
  .topic-row-wrap {
    position: relative;
    margin-bottom: 32px;
  }

  .topic-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }

  .topic-row::-webkit-scrollbar { height: 6px; }
  .topic-row::-webkit-scrollbar-track { background: transparent; }
  .topic-row::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 999px;
  }
  .topic-row::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); }

  /* 오른쪽에 더 있다는 걸 흐릿하게 알려주는 그라데이션 */
  .topic-row-wrap::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 8px;
    width: 32px;
    background: linear-gradient(to right, transparent, var(--bg));
    pointer-events: none;
  }
  .topic-row-wrap.at-end::after { opacity: 0; }

  .pill {
    flex: none;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-muted);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .pill:hover { border-color: var(--accent); color: var(--accent); }

  .pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── 논문 목록 ── */
  .entry {
    padding: 28px 0;
    border-top: 1px solid var(--line);
  }
  .entry:first-child { border-top: none; padding-top: 0; }

  .entry-meta {
    font-size: 13px;
    color: var(--ink-muted);
    margin-bottom: 6px;
  }

  .entry h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 21px;
    line-height: 1.35;
    margin: 0 0 12px;
  }

  .entry h2 a { color: var(--ink); text-decoration: none; }
  .entry h2 a:hover { color: var(--accent); }

  .summary-ko { margin-bottom: 8px; }
  .summary-en { color: var(--ink-muted); font-size: 14.5px; margin-bottom: 14px; }

  .takeaway {
    border-left: 3px solid var(--amber);
    background: var(--amber-tint);
    padding: 10px 14px;
    font-size: 14.5px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 14px;
  }

  .entry-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    font-size: 12.5px;
    color: var(--accent);
    background: var(--accent-tint);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .entry-link { font-size: 13.5px; white-space: nowrap; }

  .study-badge {
    display: inline-block;
    font-size: 12px;
    color: var(--ink-muted);
    border: 1px solid var(--line);
    padding: 1px 8px;
    border-radius: 4px;
    margin-left: 6px;
  }

  /* ── 주제(topics) 보기 ── */
  .topic-entry {
    padding: 28px 0;
    border-top: 1px solid var(--line);
  }
  .topic-entry:first-child { border-top: none; padding-top: 0; }

  .topic-entry h2 {
    font-family: 'Newsreader', serif;
    font-weight: 500;
    font-size: 22px;
    margin: 0 0 4px;
  }

  .topic-count {
    font-size: 13px;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  .topic-synthesis {
    margin-bottom: 14px;
  }

  .sub-heading {
    font-size: 15.5px;
    font-weight: 600;
    margin: 18px 0 6px;
    color: var(--ink);
  }

  .study-badge.fulltext {
    color: var(--accent);
    border-color: var(--accent);
  }

  .open-box {
    border-left: 3px solid var(--accent);
    background: var(--accent-tint);
    padding: 10px 14px;
    font-size: 14.5px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 14px;
  }

  .conflict-box {
    border-left: 3px solid var(--amber);
    background: var(--amber-tint);
    padding: 10px 14px;
    font-size: 14.5px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 14px;
  }

  .related-list {
    margin: 0;
    padding-left: 20px;
    color: var(--ink-muted);
    font-size: 14px;
  }
  .related-list li { margin-bottom: 4px; }

  /* ── 빈 상태 ── */
  #empty {
    color: var(--ink-muted);
    text-align: center;
    padding: 48px 0;
    display: none;
  }

  @media (max-width: 480px) {
    .page { padding: 32px 16px 64px; }
    .entry-footer { align-items: flex-start; flex-direction: column; }
  }

  /* ── v3: 필터·정렬·접힘 목록·나중에 볼 논문 ── */
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }
  .filter-grid select, .sort-select {
    width: 100%;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .filter-grid select.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .star-filter {
    font-family: inherit;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-muted);
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .star-filter.on { background: var(--amber-tint); border-color: var(--amber); color: var(--amber); font-weight: 600; }
  .reset-link {
    font-size: 13px; color: var(--ink-faint); background: none; border: none;
    cursor: pointer; text-decoration: underline; font-family: inherit; padding: 0;
  }
  .result-count { font-size: 13px; color: var(--ink-faint); }
  .sort-select { width: auto; }

  .month-heading {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
    padding: 18px 0 6px;
    border-bottom: 1px solid var(--line);
  }

  .entry { padding: 18px 0; }
  .entry-head { display: flex; gap: 12px; align-items: flex-start; }
  .entry-main { flex: 1; min-width: 0; }
  .entry h2 { font-size: 18.5px; margin: 0 0 8px; }
  .entry-toggle {
    all: unset;
    cursor: pointer;
    font-family: 'Newsreader', serif;
    font-weight: 500;
    color: var(--ink);
  }
  .entry-toggle:hover { color: var(--accent); }
  .entry-toggle:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .entry .takeaway { margin-bottom: 0; }
  .entry-detail { display: none; margin-top: 14px; }
  .entry.open .entry-detail { display: block; }
  .expand-hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; }
  .entry.open .expand-hint { display: none; }

  .star-btn {
    flex: none;
    font-size: 22px;
    line-height: 1;
    background: none;
    border: none;
    color: var(--line);
    cursor: pointer;
    padding: 2px 4px;
  }
  .star-btn.on { color: var(--amber); }
  .star-btn:hover { color: var(--amber); }

  .more-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .more-btn:hover { border-color: var(--accent); color: var(--accent); }

  .topic-link-btn {
    font-family: inherit;
    font-size: 13.5px;
    color: var(--accent);
    background: none;
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    margin-top: 6px;
  }
  .topic-link-btn:hover { background: var(--accent-tint); }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <h1>수의영상의학 논문 아카이브</h1>
    <div class="masthead-meta" id="mastMeta">불러오는 중...</div>
    <div class="view-tabs">
      <button class="view-tab active" data-view="papers">논문</button>
      <button class="view-tab" data-view="topics">주제</button>
    </div>
  </header>

  <div id="papersView">
    <div class="search-row">
      <input id="searchBox" type="text" placeholder="제목, 저널, 요약, 키워드로 검색...">
    </div>

    <div class="filter-grid" id="filterGrid"></div>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="star-filter" id="starFilter">★ 나중에 볼 논문</button>
        <span class="result-count" id="resultCount"></span>
        <button class="reset-link" id="resetBtn">필터 초기화</button>
      </div>
      <select class="sort-select" id="sortSelect" aria-label="정렬">
        <option value="added">최근 등록순</option>
        <option value="year">출판연도순</option>
        <option value="title">제목순</option>
      </select>
    </div>

    <div id="paperList"></div>
    <div id="empty">표시할 논문이 없습니다. 검색어나 필터를 바꿔보세요.</div>
    <button class="more-btn" id="moreBtn" style="display:none;"></button>
  </div>

  <div id="topicsView" style="display:none;">
    <div id="topicsList"></div>
    <div id="topicsEmpty" style="display:none; color:var(--ink-muted); text-align:center; padding:48px 0;">
      아직 정리된 주제가 없습니다. 논문이 몇 편 더 쌓이면 여기에 주제별 종합이 나타납니다.
    </div>
  </div>
</div>

<script>
  // 이 부분은 build_site.py가 실행될 때마다 data/papers.json,
  // data/topics.json 내용으로 자동으로 교체됩니다. 직접 손으로 수정하지 마세요.
  let allPapers = [{"pmid": "42833390", "title": "MRI FINDINGS IN CAUDA EQUINA NERVE ROOTS AND ASSOCIATED CLINICAL SIGNS IN DOGS WITH DEGENERATIVE LUMBOSACRAL STENOSIS.", "journal": "Veterinary journal (London, England : 1997)", "year": "2026", "authors": ["Aiste Siauciunaite", "Daniela Alder", "Henning Richter", "Frank Steffen"], "url": "https://pubmed.ncbi.nlm.nih.gov/42833390/", "doi": "10.1016/j.tvjl.2026.106916", "study_type": "후향적 연구", "sample_size": "67", "evidence_basis": "abstract", "species": ["dog"], "modality": ["MRI"], "system": ["spine", "neuro"], "topics": ["spinal-imaging"], "tags": ["dog", "MRI", "spine", "neuro"], "added_on": "2026-10-06", "summary_ko": "Degenerative lumbosacral stenosis(DLSS) 개 50마리와 대조군 17마리(총 67마리)를 대상으로 high-field MRI에서 cauda equina nerve root의 크기, 신호 특성, 위치(nerve root sedimentation sign, NRSS), 주행(redundant nerve roots, RNR)을 평가하고 임상 증상과의 연관성을 분석한 후향적 case-control 연구다. Lumbosacral foraminal stenosis는 DLSS군 66%, 대조군 5.88%에서 확인되었고(p<0.001), lumbar nerve root pathology는 DLSS군 60%, 대조군 11.77%에서 확인되었다(p<0.001). 편측 임상 증상은 동측 foraminal stenosis와 유의하게 연관되었고, L7 nerve root 비후도 동측 신경 기능장애와 유의하게 연관되었다. NRSS는 양군 간 차이가 없었으나 RNR은 DLSS와 약한~중등도 연관성을 보였다.", "summary_en": "This retrospective, blinded, case-control study evaluated the size, signal characteristics, position (nerve root sedimentation sign, NRSS), and course (redundant nerve roots, RNR) of cauda equina nerve roots using high-field MRI in 50 dogs with degenerative lumbosacral stenosis (DLSS) and 17 control dogs, and assessed associations with clinical signs. Lumbosacral foraminal stenosis was found in 66% of DLSS cases versus 5.88% of controls (p < 0.001), and lumbar nerve root pathology in 60% versus 11.77% (p < 0.001). Unilateral clinical signs were significantly associated with ipsilateral foraminal stenosis, and ipsilateral L7 nerve root thickening was significantly associated with unilateral nerve root dysfunction. NRSS did not differ between groups, while RNR showed a small-to-moderate association with DLSS.", "clinical_takeaway_ko": "DLSS가 의심되는 개의 MRI를 판독할 때 central canal·intervertebral foramen 협착 외에도 nerve root 비후(특히 L7)와 foraminal stenosis의 좌우 대칭성을 함께 평가하면, 편측 임상 증상의 해부학적 원인을 더 구체적으로 짚어낼 수 있다. NRSS는 진단적 가치가 낮아 보조 지표로서의 비중을 낮추는 것이 합리적이다."}, {"pmid": "42828236", "title": "Case Report: Clinical and magnetic resonance imaging findings in intracranial hemangiosarcoma in a cat.", "journal": "Frontiers in veterinary science", "year": "2026", "authors": ["Irene Marsellés-González", "Livia Benigni", "Emilie Cloup", "Ricardo Fernandes"], "url": "https://pubmed.ncbi.nlm.nih.gov/42828236/", "doi": "10.1111/j.1939-1676.1989.tb00861.x", "study_type": "증례보고", "sample_size": "1", "evidence_basis": "abstract", "species": ["cat"], "modality": ["MRI"], "system": ["neuro", "oncology"], "topics": ["neuro-imaging"], "tags": ["cat", "MRI", "neuro", "oncology"], "added_on": "2026-10-06", "summary_ko": "Hemangiosarcoma(HSA)는 내피세포 기원의 고악성 종양으로 고양이에서는 비조혈계 종양의 2% 미만을 차지할 정도로 드물고, dermal·visceral subtype 모두 전이 가능성이 있다. 개에서는 뇌로 전이하는 가장 흔한 종양이지만 고양이의 두개내 침범은 매우 드물어 기존에 전이성 증례가 1예만 보고되어 있었다. 이 증례보고는 고양이 1마리에서 두개내 hemangiosarcoma의 임상 양상, MRI 소견, 조직병리 소견, 부검상 육안적 뇌 변화를 상세히 기술했다.", "summary_en": "Hemangiosarcoma (HSA) is a highly malignant tumor of endothelial origin that is infrequently reported in cats, accounting for less than 2% of nonhematopoietic neoplasms. Feline HSA is typically classified into dermal and visceral subtypes, both of which exhibit metastatic potential. While HSA is the tumor most commonly reported to metastasize to the brain in dogs, intracranial involvement in cats remains rare, with only one previously documented metastatic case. This case report details the clinical presentation, magnetic resonance imaging (MRI) features, histopathological findings, and gross post-mortem brain changes in a cat diagnosed with intracranial hemangiosarcoma.", "clinical_takeaway_ko": "고양이에서 두개내 병변이 발견되었을 때 HSA는 흔한 감별진단은 아니지만, 전신 HSA 병력이 있거나 MRI상 출혈을 동반한 병변이 확인되면 감별진단 목록에 포함할 가치가 있다. 다만 이 증례만으로 고양이 두개내 HSA에 특징적인 MRI 신호 패턴을 일반화하기는 어렵다."}, {"pmid": "42827366", "title": "EXPRESS: Evaluation of Left Atrial Reservoir Strain by Two-Dimensional Speckle-Tracking Echocardiography in Cats with Stage B1 Hypertrophic Cardiomyopathy.", "journal": "Journal of feline medicine and surgery", "year": "2026", "authors": ["Didem Algan", "Tuğba Varlik", "Maiken Bayer Thode Bach", "Caroline Høberg Gleerup", "Zeki Yilmaz", "Jørgen Koch"], "url": "https://pubmed.ncbi.nlm.nih.gov/42827366/", "doi": "10.1177/1098612X261497177", "study_type": "후향적 연구", "sample_size": "61", "evidence_basis": "abstract", "species": ["cat"], "modality": ["echocardiography"], "system": ["cardiovascular"], "topics": ["cardiac-imaging"], "tags": ["cat", "echocardiography", "cardiovascular"], "added_on": "2026-10-06", "summary_ko": "건강한 고양이(Stage A, n=30)와 ACVIM stage B1 hypertrophic cardiomyopathy(HCM) 고양이(n=31) 총 61마리를 후향적으로 분석해 2D speckle-tracking echocardiography(2D-STE)로 측정한 left atrial reservoir strain(LA S_R)을 비교한 연구다. LA/Ao ratio·LA diameter·LA area·LA fractional shortening·LA ejection fraction 등 기존 2차원 지표와 함께 automated function imaging software로 LA S_R을 오프라인 측정했다. Stage B1 HCM 고양이는 건강한 대조군보다 LA S_R이 유의하게 낮았고(19.0% vs 38.0%, P<0.001), intra-observer ICC 0.974·inter-observer ICC 0.894로 재현성이 높았다.", "summary_en": "In this retrospective study of 61 client-owned cats (30 healthy Stage A controls, 31 ACVIM Stage B1 hypertrophic cardiomyopathy [HCM] cats), left atrial reservoir strain (LA S_R) measured offline by two-dimensional speckle-tracking echocardiography (2D-STE) using automated function imaging software was compared alongside conventional LA size and function variables. Cats with Stage B1 HCM had significantly lower LA S_R than healthy controls (19.0% vs 38.0%, P < 0.001), with high intra-observer (ICC 0.974) and inter-observer (ICC 0.894) reproducibility.", "clinical_takeaway_ko": "Stage B1 HCM이 의심되는 고양이에서 conventional 2D echocardiography 지표와 함께 LA S_R을 추가로 측정하면 좌심방 기능의 미세한 저하를 더 민감하게 포착할 수 있는 보조 지표로 활용할 수 있으나, 측정에는 automated function imaging software와 숙련된 판독이 필요하다."}, {"pmid": "42826750", "title": "Dogs and cats undergoing surgery for penetrating thoracic trauma have high survival despite frequent complications, and imaging may underestimate injury severity.", "journal": "Journal of the American Veterinary Medical Association", "year": "2026", "authors": ["Nirali Pathak", "Beth Lozano", "Yingxuan Winnie Wang", "Chanel Berns", "Rahyeon Ahn", "Ameet Singh", "Cassie N Lux", "Samantha Glamann", "Kathleen Ham", "Vanna Dickerson"], "url": "https://pubmed.ncbi.nlm.nih.gov/42826750/", "doi": "10.2460/javma.26.06.0466", "study_type": "후향적 연구", "sample_size": "91", "evidence_basis": "abstract", "species": ["dog", "cat"], "modality": ["radiography", "CT"], "system": ["thorax", "trauma"], "topics": ["trauma-forensic-imaging"], "tags": ["dog", "cat", "radiography", "CT", "thorax", "trauma"], "added_on": "2026-10-06", "summary_ko": "5개 referral hospital의 기록을 검토해 수술로 확진된 penetrating thoracic trauma 개 86마리·고양이 5마리(총 91마리)의 임상·방사선 소견과 예후의 연관성을 평가한 다기관 후향적 연구다. 흉부 방사선에서 pneumothorax(73.6%), pulmonary contusion(65.9%), rib fracture(62.6%)가 흔히 확인되었으나, computed tomography를 시행한 경우 방사선보다 더 많은 손상이 확인되는 경우가 많았다. Lung lobectomy는 24.2%에서 시행되었고 비생존군에서 더 흔했다(45.0% vs 18.3%). 생존율은 78.0%(91마리 중 71마리)였고, animal trauma triage score가 비생존군에서 유의하게 높았다(7.6±2.4 vs 5.2±2.5).", "summary_en": "This retrospective, multicenter study reviewed records from 5 referral hospitals to identify 86 dogs and 5 cats with surgically confirmed penetrating thoracic trauma, evaluating associations between clinical/radiographic findings and outcomes. Radiographic findings included pneumothorax (73.6%), pulmonary contusions (65.9%), and rib fractures (62.6%), while computed tomography often identified more injuries than radiographs. Lung lobectomy was performed in 24.2% of patients and was more common in nonsurvivors (45.0% vs 18.3%). Survival to discharge was 78.0% (71 of 91), and animal trauma triage scores were significantly higher in nonsurvivors (7.6 ± 2.4 vs 5.2 ± 2.5).", "clinical_takeaway_ko": "Penetrating thoracic trauma 환자에서 흉부 방사선만으로는 실제 손상 범위(특히 폐·흉벽 손상)를 과소평가할 수 있으므로, 임상적으로 중증도가 의심되거나 수술 계획이 필요한 경우 CT로 추가 평가하는 것이 손상 범위 파악과 치료 계획에 더 유리할 수 있다."}, {"pmid": "42825365", "title": "Multimodal MRI findings in a dog with suspected global brain ischemia and peri-anesthetic blindness.", "journal": "Journal of veterinary science", "year": "2026", "authors": ["Hye-Won Lee", "Yoonhoi Koo", "Kija Lee", "Sang-Kwon Lee"], "url": "https://pubmed.ncbi.nlm.nih.gov/42825365/", "doi": "10.4142/jvs.26132", "study_type": "증례보고", "sample_size": "1", "evidence_basis": "abstract", "species": ["dog"], "modality": ["MRI"], "system": ["neuro"], "topics": ["neuro-imaging"], "tags": ["dog", "MRI", "neuro"], "added_on": "2026-10-06", "summary_ko": "전신마취 후 입원 치료를 받고 퇴원 시점에 급성 양측 실명이 확인된 10세 중성화하지 않은 수컷 Welsh Corgi 1예의 증례보고다. Conventional MRI(T2-weighted, FLAIR, diffusion-weighted imaging)에서는 diffuse cerebral swelling과 sulcal effacement만 보였고, global brain ischemia(GBI)의 전형적 소견인 피질 T2W/FLAIR hyperintensity나 명확한 diffusion restriction은 확인되지 않아 진단이 애매했다. Advanced MRI를 추가한 결과, arterial spin labeling(ASL)에서 cortex·thalamus의 뚜렷한 cerebral blood flow(CBF) 저하, dynamic susceptibility contrast(DSC)에서 relative CBF 감소·relative CBV 증가·관류 지연, time-of-flight MR angiography에서 두개내 동맥 조영 저하, diffusion tensor imaging(DTI)에서 피질의 fractional anisotropy·diffusivity 이상이 모두 확인되어 global hypoperfusion과 미세구조 손상이 뒷받침되었다. Mannitol 등 보존적 치료에도 실명은 지속되었고 신경학적 예후는 불량했다.", "summary_en": "This case report describes a 10-year-old intact male Welsh Corgi with acute bilateral blindness noted at discharge after overnight hospitalization following general anesthesia, in which conventional MRI (T2W, FLAIR, DWI) was equivocal, showing only diffuse cerebral swelling and sulcal effacement without the cortical hyperintensity or clear diffusion restriction typically described in global brain ischemia (GBI). Advanced MRI supported suspected GBI: arterial spin labeling showed markedly reduced cortical and thalamic CBF, dynamic susceptibility contrast showed reduced relative CBF with increased relative CBV and prolonged transit, time-of-flight MR angiography showed poor intracranial arterial conspicuity, and diffusion tensor imaging demonstrated cortical microstructural alterations. Despite mannitol and supportive care, blindness persisted and the dog had a poor neurologic outcome.", "clinical_takeaway_ko": "Peri-anesthetic 급성 신경학적 이상(특히 실명)을 보인 환자에서 conventional T2W/FLAIR/DWI MRI가 뚜렷하지 않다고 global brain ischemia를 배제할 수 없으며, 장비·시간이 허락한다면 ASL·DSC perfusion, TOF MRA, DTI 같은 advanced MRI 기법을 추가해 global hypoperfusion과 미세구조 손상을 확인하는 것이 진단에 도움이 될 수 있다."}, {"pmid": "42822806", "title": "Geometric morphometric analysis of cardiac shape changes associated with myxomatous mitral valve disease in Cavalier King Charles Spaniels.", "journal": "Veterinary journal (London, England : 1997)", "year": "2026", "authors": ["Caner Bakıcı", "Murat Vurucu", "İhsan Berat Kılıçlı", "Ezgi Deniz Mavili", "Barış Batur"], "url": "https://pubmed.ncbi.nlm.nih.gov/42822806/", "doi": "10.1016/j.tvjl.2026.106901", "study_type": "후향적 연구", "sample_size": "54", "evidence_basis": "abstract", "species": ["dog"], "modality": ["radiography", "echocardiography"], "system": ["cardiovascular"], "topics": ["cardiac-imaging"], "tags": ["dog", "radiography", "echocardiography", "cardiovascular"], "added_on": "2026-10-06", "summary_ko": "Echocardiography와 right lateral thoracic radiography를 모두 시행한 Cavalier King Charles Spaniel(CKCS) 54마리(ACVIM stage A~D)의 흉부 방사선에서 10개 해부학적 landmark를 digitize해 2차원 geometric morphometric 분석(Generalized Procrustes Analysis, PCA, DFA, MANOVA, CVA)을 수행한 후향적 연구다. 상위 3개 principal component가 전체 shape variation의 78.68%를 설명했고, MANOVA·CVA·DFA 모두에서 stage 간 심장 silhouette 형태의 유의한 차이가 확인되었으며(특히 stage B2 vs D, B1 vs B2), vertebral heart score(VHS)·vertebral left atrial score(VLAS)도 stage 간 유의하게 달랐다. Shape 변화는 좌심방 경계의 비균질 확장, 심첨의 craniodorsal 이동, 진행성 globular remodeling으로 특징지어졌다.", "summary_en": "In this retrospective study of 54 Cavalier King Charles Spaniels (CKCS, ACVIM stages A-D) who underwent both echocardiography and right lateral thoracic radiography, two-dimensional geometric morphometric analysis (Generalized Procrustes Analysis, PCA, DFA, MANOVA, CVA) was performed on 10 anatomically homologous landmarks digitized from thoracic radiographs. The first three principal components explained 78.68% of total shape variation, and MANOVA, CVA, and DFA all showed significant intergroup shape differences (most pronounced between stages B2 and D, and between B1 and B2), with vertebral heart score (VHS) and vertebral left atrial score (VLAS) also differing significantly across stages. Shape changes were characterized by non-homogeneous expansion of the left atrial border, craniodorsal displacement of the cardiac apex, and progressive globular remodeling.", "clinical_takeaway_ko": "VHS·VLAS 같은 전통적 선형 지표에 더해 심장 silhouette의 형태 자체(좌심방 경계 확장, 심첨 이동, globular remodeling)를 살펴보면, 특히 치료 시작 시점이 갈리는 B1→B2 전환에서 방사선만으로도 추가적인 단서를 얻을 수 있을 가능성이 있다. 다만 이 기법은 아직 landmark digitizing 등 특수 소프트웨어가 필요해 일상 진료에 바로 적용하기는 어렵다."}, {"pmid": "42820725", "title": "Influence of including or excluding endocardial borders on left ventricular wall thickness measurements in cats.", "journal": "Journal of veterinary internal medicine", "year": "2026", "authors": ["Maximiliane G Sehn", "Yuen Yee Cheuk", "Jose Novo Matos", "David Brodbelt", "Virginia Luis Fuentes"], "url": "https://pubmed.ncbi.nlm.nih.gov/42820725/", "doi": "10.11613/BM.2012.031", "study_type": "후향적 연구", "sample_size": "52", "evidence_basis": "abstract", "species": ["cat"], "modality": ["echocardiography"], "system": ["cardiovascular"], "topics": ["cardiac-imaging"], "tags": ["cat", "echocardiography", "cardiovascular"], "added_on": "2026-10-06", "summary_ko": "건강, HCM 의증(equivocal), HCM 표현형으로 이전에 분류된 고양이 52마리의 저장된 echocardiography 영상을 관찰자 3인이 4가지 서로 다른 leading-edge/trailing-edge 조합(leading-to-leading, leading-to-trailing, trailing-to-leading, trailing-to-trailing)으로 interventricular septum(IVS)·left ventricular free wall(LVFW) 두께를 측정해 비교한 단일기관 후향적 cross-sectional 연구다. Leading-edge-to-trailing-edge 측정법이 가장 큰 값을(IVS 중앙값 5.5mm), trailing-edge-to-leading-edge 측정법이 가장 작은 값을(IVS 4.3mm, LVFW 4.8mm) 보였으며(모두 p<.001), IVS에서 두 방법 간 중앙값 차이는 1.2mm였다.", "summary_en": "In a single-center retrospective cross-sectional study, three observers measured interventricular septal and left ventricular free wall thickness in 52 cats previously classified as healthy, equivocal for HCM, or having an HCM phenotype, using four different endocardial border combinations (leading-to-leading, leading-to-trailing, trailing-to-leading, trailing-to-trailing edge). Leading-edge-to-trailing-edge measurements were significantly larger (median IVS 5.5 mm) and trailing-edge-to-leading-edge measurements significantly smaller (median IVS 4.3 mm, LVFW 4.8 mm) than other methods (all p < .001), with a 1.2 mm median difference in IVS thickness between the two extreme methods. The authors conclude that left ventricular wall thickness varies meaningfully depending on which endocardial borders are included, and recommend standardizing the number of borders used.", "clinical_takeaway_ko": "어떤 endocardial border 조합을 사용하느냐에 따라 같은 고양이의 IVS·LVFW 두께 측정값이 최대 1.2mm까지 달라질 수 있고, 이는 HCM 여부를 가르는 cut-off(흔히 약 6mm 전후) 근처에서 개체의 분류를 바꿀 수 있는 크기다. 따라서 LVWT를 측정할 때 어떤 edge convention을 쓰는지 명확히 하고, 추적검사에서도 동일한 방법을 일관되게 적용해야 하며, 특히 borderline 두께를 보이는 고양이에서는 이 점이 중요하다."}, {"pmid": "42815534", "title": "Computed tomography perfusion parameters may aid preoperative differentiation of canine pheochromocytomas from adrenocortical tumors.", "journal": "American journal of veterinary research", "year": "2026", "authors": ["Kaito Iida", "Kumiko Ishigaki", "Chieko Ishikawa", "Naoko Shiozawa", "Miran Kinpara", "Takeshi Hayakawa", "Shoko Yamaoka", "Naoki Yamada", "Pinhui Wang", "Orie Yoshida", "Yumiko Kagawa", "Kazushi Asano"], "url": "https://pubmed.ncbi.nlm.nih.gov/42815534/", "doi": "10.2460/ajvr.26.06.0280", "study_type": "후향적 연구", "sample_size": "25", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT"], "system": ["endocrine", "oncology"], "topics": ["endocrine-imaging"], "tags": ["dog", "CT", "endocrine", "oncology"], "added_on": "2026-10-06", "summary_ko": "건강한 Beagle 5마리(대조군)와, triple-phase CT·CT perfusion(CTP)·adrenalectomy·조직병리를 거친 client-owned 개 20마리(종양 22개: adrenocortical adenoma 8, adrenocortical carcinoma 7, pheochromocytoma 7)를 대상으로 CTP에서 유도한 time to highest observed adrenal tissue enhancement(T-peak)와 arterial blood flow(AF)를 비교한 후향적 연구다. T-peak는 두 adrenocortical tumor군 모두에서 pheochromocytoma보다 길었고, 36.0초 미만 cutoff가 100% 민감도·특이도를 보였다(사후 분석). AF는 두 adrenocortical tumor군에서 대조군보다 낮았고 pheochromocytoma에서는 adrenocortical carcinoma보다 높았으며, AUC 0.923·100.60 mL/min/100mL 초과 cutoff에서 85.7% 민감도·100% 특이도를 보였다. 편측 종양 17마리에서는 tumor-to-contralateral AF ratio가 pheochromocytoma와 adrenocortical tumor를 완전히 분리했다.", "summary_en": "This retrospective study compared CT perfusion (CTP)-derived time to highest observed adrenal tissue enhancement (T-peak) and arterial blood flow (AF) in 5 healthy control Beagles and 20 client-owned dogs with 22 adrenal tumors (8 adrenocortical adenomas, 7 adrenocortical carcinomas, 7 pheochromocytomas) who underwent triple-phase CT, CTP, adrenalectomy, and histopathology. T-peak was longer in both adrenocortical tumor groups than in pheochromocytomas, with a post hoc cutoff < 36.0 seconds yielding apparent 100% sensitivity and specificity. AF was lower in both adrenocortical tumor groups than in controls and higher in pheochromocytomas than in adrenocortical carcinomas (AUC 0.923; cutoff > 100.60 mL/min/100 mL yielding 85.7% sensitivity, 100% specificity). Among 17 dogs with unilateral tumors, the tumor-to-contralateral AF ratio completely separated pheochromocytomas from adrenocortical tumors.", "clinical_takeaway_ko": "부신 종양의 수술 전 감별이 필요한 개에서 기존 triple-phase CT 소견에 CT perfusion 지표(T-peak, AF, 특히 양측 비교가 가능한 tumor-to-contralateral AF ratio)를 추가하면 pheochromocytoma와 adrenocortical tumor를 구분하는 데 도움이 될 수 있으나, 제시된 cutoff는 소규모 단일기관 자료에서 나온 것이므로 그대로 진단 기준으로 쓰기보다는 보조 정보로 활용하는 것이 안전하다."}, {"pmid": "42813598", "title": "Veterinary point-of-care ultrasound probe orientation and location for detection of pleural effusion in canine cadavers: a pilot study.", "journal": "The Journal of small animal practice", "year": "2026", "authors": ["C Di Franco", "J Menard", "A Romero", "S Chalhoub", "V Madden", "S R Boysen"], "url": "https://pubmed.ncbi.nlm.nih.gov/42813598/", "doi": "10.1111/jsap.70196", "study_type": "실험 연구", "sample_size": "12", "evidence_basis": "abstract", "species": ["dog"], "modality": ["ultrasound"], "system": ["thorax", "technique"], "topics": ["imaging-technique-safety", "thoracic-imaging"], "tags": ["dog", "ultrasound", "thorax", "technique"], "added_on": "2026-10-06", "summary_ko": "양압 환기 중인, scant~large volume pleural effusion을 가진 intubated canine cadaver 12구를 sternal recumbency에서 12명의 operator(응급·중환자 전문의 2명, 수의대생 2명, intern 8명)가 두 가지 무작위 프로토콜로 양측 흉부 point-of-care ultrasound를 시행한 pilot study다. Modified TFAST for pleural fluid 기법과 modified Calgary PLUS for pleural fluid 기법을 비교한 결과, 전체 pleural effusion 검출률은 Calgary PLUS 변형 기법이 TFAST 변형 기법보다 유의하게 높았다(89.1% vs 60.9%, P<.001). Scant-to-mild effusion에서는 Calgary PLUS 변형 기법이 유의하게 우수했으나(84.4% vs 37.5%, P<.001) moderate-to-large effusion에서는 두 기법 간 차이가 없었다(93.8% vs 84.4%, P=.25).", "summary_en": "In this pilot study, 12 intubated canine cadavers with scant to large volume pleural effusion, under positive pressure ventilation in sternal recumbency, were scanned by 12 operators (2 emergency/critical care specialists, 2 veterinary students, 8 interns) using two randomized bilateral thoracic point-of-care ultrasound protocols. Overall detection of pleural effusion was significantly higher with the modified Calgary PLUS for pleural fluid technique than the modified TFAST for pleural fluid technique (89.1% vs 60.9%, P < .001). Detection of scant-to-mild effusion was significantly better with Calgary PLUS (84.4% vs 37.5%, P < .001), but there was no significant difference for moderate-to-large effusions (93.8% vs 84.4%, P = .25).", "clinical_takeaway_ko": "흉부 POCUS로 pleural effusion을 선별할 때, 특히 소량~경도 삼출(scant-to-mild effusion)이 의심되는 환자에서는 probe를 costochondral junction보다 더 ventral한 부위에서 rib에 평행하게(parallel) 대는 modified Calgary PLUS 방식이 전통적 TFAST 방식보다 검출률이 높을 수 있다. 중등도~대량 삼출에서는 두 기법 간 차이가 크지 않으므로, 소량 삼출을 놓치기 쉬운 상황(외상 초기 평가 등)에서 이 결과를 우선 적용해볼 수 있다."}, {"pmid": "42813384", "title": "Evaluation of Intracranial Lesions Using Deep Learning-Based Reconstruction in Canine Brain MRI: Comparison With Conventional Reconstruction on T2-Weighted and FLAIR Sequences.", "journal": "Veterinary radiology & ultrasound : the official journal of the American College of Veterinary Radiology and the International Veterinary Radiology Association", "year": "2026", "authors": ["Wooseok Jin", "Hyemin Na", "Sang-Kwon Lee", "Hojung Choi", "Youngwon Lee", "Kija Lee"], "url": "https://pubmed.ncbi.nlm.nih.gov/42813384/", "doi": "10.1111/vru.70260", "study_type": "후향적 연구", "sample_size": "25", "evidence_basis": "abstract", "species": ["dog"], "modality": ["MRI"], "system": ["neuro", "AI"], "topics": ["neuro-imaging", "ai-imaging"], "tags": ["dog", "MRI", "neuro", "AI"], "added_on": "2026-10-06", "summary_ko": "두개내 질환으로 진단된 개 25예의 brain MRI 검사를 대상으로, deep learning-based reconstruction(DLR)과 conventional reconstruction을 T2-weighted·FLAIR 시퀀스에서 비교한 후향적 연구다. DLR 영상은 두 시퀀스 모두에서 conventional 영상보다 signal-to-noise ratio(SNR)·contrast-to-noise ratio(CNR)·lesion edge sharpness가 유의하게 높았고(p<0.05), 블라인드 판독한 두 명의 radiologist가 평가한 영상 품질·lesion conspicuity 점수도 유의하게 높았다. Truncation artifact는 유의하게 감소했으나 motion·pulsation artifact는 개선되지 않았고, pseudolesion이나 lesion masking 사례는 관찰되지 않았다.", "summary_en": "This retrospective study compared deep learning-based reconstruction (DLR) with conventional reconstruction on T2-weighted and FLAIR sequences in 25 canine brain MRI examinations diagnosed with intracranial disease. DLR images showed significantly higher SNR, CNR, and lesion edge sharpness than conventional images in both sequences (p < 0.05), along with significantly higher radiologist-rated image quality and lesion conspicuity scores. Truncation artifact was significantly reduced, but motion and pulsation artifacts were not improved, and no instances of pseudolesions or lesion masking were observed.", "clinical_takeaway_ko": "DLR을 사용할 수 있는 1.5T MRI 환경이라면 두개내 병변이 의심되는 개 환자의 T2-weighted·FLAIR 시퀀스에 DLR을 적용해 병변 가시성과 영상 품질을 향상시킬 수 있지만, motion·pulsation artifact가 있는 환자에서는 DLR만으로 이를 해결하지 못하므로 여전히 진정·환자 고정 등 기존 artifact 관리가 필요하다."}, {"pmid": "42807202", "title": "Machine-driven vs. manual nickel-titanium instrumentation of canine teeth in dogs: a high resolution micro-CT evaluation of canal geometry and obturation quality.", "journal": "Frontiers in veterinary science", "year": "2026", "authors": ["Johanna Wunderl", "Matthias Eberspächer-Schweda", "Stephan Handschuh", "Alexander Tichy", "Eva Schnabl-Feichter"], "url": "https://pubmed.ncbi.nlm.nih.gov/42807202/", "doi": "10.1016/j.joen.2017.07.025", "study_type": "실험 연구", "sample_size": "30", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT"], "system": ["dental", "head-neck"], "topics": ["head-neck-imaging"], "tags": ["dog", "CT", "dental", "head-neck"], "added_on": "2026-10-06", "summary_ko": "발치된 개 canine teeth 30개를 3군(n=10)으로 나누어 machine-driven nickel-titanium(Ni-Ti) instrumentation 2종과 manual Ni-Ti instrumentation을 비교한 ex vivo 실험 연구다. Pre-/post-treatment micro-CT로 canal geometry, post-to-pre canal volume ratio, internal air volume(obturation 균질성), instrument-canal diameter 불일치를 정량 평가하고, post-treatment CBCT의 진단적 가치도 함께 평가했다. Machine-driven 시스템은 manual instrumentation 대비 instrument-canal diameter 불일치가 유의하게 작았고(p=0.008) internal air volume도 더 적어(p=0.017) 더 균질한 obturation을 보였다. CBCT에서 확인된 dentin-filling interface의 radiolucent zone은 micro-CT로 대조한 결과 실제 void·debris가 아니라 영상 artifact로 밝혀졌다.", "summary_en": "Thirty extracted canine teeth from dogs were randomly assigned to three groups (n = 10) and instrumented with two machine-driven Ni-Ti systems or manual Ni-Ti hand files, with pre- and post-treatment micro-CT used to quantify canal geometry, volume ratio, air inclusion, and instrument-canal diameter discrepancy. Machine-driven systems showed significantly smaller diameter discrepancies and less internal air volume than manual instrumentation, indicating more homogeneous obturation, despite similar post-to-pre canal volume ratios. Procedural complications occurred in 26.7% of specimens, more often with the less experienced operator. Postoperative CBCT showed radiolucent zones at the dentin-filling interface that micro-CT confirmed were imaging artifacts rather than true voids or debris, cautioning against over-interpreting such CBCT findings.", "clinical_takeaway_ko": "수의 root canal 치료 후 CBCT에서 dentin-filling interface에 radiolucent zone이 보여도 이것이 반드시 실제 결함을 의미하지는 않으므로, 임상 증상·추가 소견 없이 CBCT 소견만으로 재치료를 결정하지 않도록 주의가 필요하다. 가능하다면 machine-driven Ni-Ti instrumentation이 더 균질한 obturation을 만들 수 있다는 점도 참고할 만하다."}, {"pmid": "42807023", "title": "Color-Flow Doppler Detection of Partial Anomalous Pulmonary Venous Drainage in a Dog.", "journal": "CASE (Philadelphia, Pa.)", "year": "2026", "authors": ["Abigail T Kaplan", "Kailah M Buchanan", "Weihow Hsue"], "url": "https://pubmed.ncbi.nlm.nih.gov/42807023/", "doi": "10.1016/j.case.2026.05.010", "study_type": "증례보고", "sample_size": "1", "evidence_basis": "abstract", "species": ["dog"], "modality": ["echocardiography", "CT"], "system": ["cardiovascular"], "topics": ["cardiac-imaging"], "tags": ["dog", "echocardiography", "CT", "cardiovascular"], "added_on": "2026-10-06", "summary_ko": "초록이 3개의 핵심 bullet만으로 제공되는 극히 짧은 증례보고다. 개 1예에서 partial anomalous pulmonary venous drainage(PAPVD, pulmonary vein이 좌심방뿐 아니라 양쪽 atria로 들어가는 선천성 기형)를 color-flow Doppler echocardiography로 발견했으며, PAPVD가 color-flow Doppler에서 flow reversal을 유발할 수 있다는 점과 sinus venosus defect가 anomalous pulmonary venous connection과 흔히 동반된다는 점을 보여준다. Keyword에 computed tomography angiography(CTA)도 포함되어 확진 과정에 CT가 함께 쓰였을 가능성이 있으나, 초록 본문에는 구체적 CT 소견 서술이 없다.", "summary_en": "This very brief case report, presented as three summary bullet points, describes color-flow Doppler echocardiographic detection of partial anomalous pulmonary venous drainage (PAPVD) in a dog, in which pulmonary veins enter both atria rather than only the left atrium. The report notes that PAPVD can cause flow reversal on color-flow Doppler and that sinus venosus defects are often linked to anomalous pulmonary venous connections. Computed tomography angiography is listed as a keyword, suggesting it may have contributed to confirming the diagnosis, but no specific CT findings are described in the abstract text itself.", "clinical_takeaway_ko": "원인이 불명확한 color-flow Doppler flow reversal 소견이나 atrial septal defect·sinus venosus defect가 의심되는 환자에서 PAPVD를 감별진단에 포함하고, 필요하면 CTA로 pulmonary vein 주행을 추가 확인하는 것이 진단에 도움이 될 수 있다."}, {"pmid": "42801331", "title": "Idiopathic cholesterol pericarditis in a dog presenting with cardiac tamponade.", "journal": "Journal of veterinary internal medicine", "year": "2026", "authors": ["Berry Wong", "Shamanthi Shankar", "Elpida Sarvani", "Alexander Civello", "Jessie R Payne"], "url": "https://pubmed.ncbi.nlm.nih.gov/42801331/", "doi": "10.1111/jvim.12415", "study_type": "증례보고", "sample_size": "1", "evidence_basis": "abstract", "species": ["dog"], "modality": ["ultrasound", "echocardiography", "CT"], "system": ["cardiovascular"], "topics": ["cardiac-imaging"], "tags": ["dog", "ultrasound", "echocardiography", "CT", "cardiovascular"], "added_on": "2026-09-30", "summary_ko": "7년 6개월령 중성화 암컷 Pug 1마리가 기면·식욕부진·다음·복부팽만·호흡곤란으로 내원했다. Point-of-care ultrasonography에서 tricavitary effusion과 cardiac tamponade가 확인되었고, pericardiocentesis로 83 mL의 혈성 삼출액을 뽑았다. 임상검사·혈액검사·echocardiography·심전도·흉복부 CT·심낭액 배양을 포함한 검사에서 심혈관·내분비·종양·감염성 원인이 모두 배제되었고, 심낭액에서 높은 콜레스테롤 농도와 다수의 콜레스테롤 결정이 확인되어 cholesterol pericarditis로 진단되었다. 7주 후 subtotal pericardiectomy를 시행했고 조직검사에서 종양은 확인되지 않았으며, 4개월 뒤 재발성 흉수 관리를 위해 pleural port를 삽입했으나 10주 후 삶의 질 저하로 안락사했다.", "summary_en": "A 7-year-6-month-old spayed female Pug presented with lethargy, hyporexia, polydipsia, abdominal distension, and dyspnea. Point-of-care ultrasonography identified tricavitary effusions and cardiac tamponade, and pericardiocentesis yielded 83 mL of sanguineous fluid. A thorough diagnostic work-up including echocardiography, ECG, thoracic and abdominal CT, and pericardial fluid culture excluded cardiovascular, endocrine, neoplastic, and infectious causes; pericardial fluid analysis showed high cholesterol concentrations and numerous cholesterol crystals, supporting a diagnosis of idiopathic cholesterol pericarditis. Subtotal pericardiectomy was performed 7 weeks later, with histopathology showing no neoplasia, but recurrent pleural effusion required a pleural port and the dog was eventually euthanized for quality-of-life concerns.", "clinical_takeaway_ko": "원인불명 pericardial effusion·cardiac tamponade 환자에서 echocardiography·CT로 종양성·감염성 원인이 배제되면, 심낭액 세포검사에서 콜레스테롤 결정 유무를 확인해 cholesterol pericarditis 감별을 고려할 가치가 있다."}, {"pmid": "42798418", "title": "Predicting stage B2 myxomatous mitral valve disease in dogs using machine learning and routine clinical data.", "journal": "Frontiers in veterinary science", "year": "2026", "authors": ["Hasuk Nam", "Kyungchang Jeong", "Hanbit Seo", "Yeon Chae", "Byeong-Teck Kang", "Euijong Lee", "Taesik Yun", "Hakhyun Kim"], "url": "https://pubmed.ncbi.nlm.nih.gov/42798418/", "doi": "10.1155/2016/4727054", "study_type": "후향적 연구", "sample_size": "387", "evidence_basis": "abstract", "species": ["dog"], "modality": ["radiography", "echocardiography"], "system": ["cardiovascular", "AI"], "topics": ["ai-imaging", "cardiac-imaging"], "tags": ["dog", "radiography", "echocardiography", "cardiovascular", "AI"], "added_on": "2026-09-30", "summary_ko": "Echocardiography가 개 stage B2 myxomatous mitral valve disease(MMVD) 진단의 gold standard이지만 2차 진료 현장에서는 장비·전문 인력 접근성이 제한적이라는 문제의식에서, echocardiography 없이 routine clinical data만으로 stage B2를 식별하는 머신러닝 모델을 개발했다. Client-owned 개 387마리(non-stage B2 252마리, stage B2 135마리)의 인구학적·혈액학적·혈청생화학적·요검사·흉부 방사선 변수를 이용해 gradient boosting 모델을 학습(80%)·검증(20%)한 결과, 정확도 0.825, 민감도 0.815, 특이도 0.830, ROC AUC 0.922로 높은 분류 성능을 보였다. 저자들은 이 모델이 echocardiography에 접근하기 어려운 상황에서 stage B2 조기 발견과 전문의 의뢰 판단을 도울 수 있다고 결론지었다.", "summary_en": "Although echocardiography is the gold standard for diagnosing stage B2 cardiac remodeling in canine myxomatous mitral valve disease (MMVD), it has limited availability and requires specialized expertise in general clinical settings. This study developed a machine learning model to identify dogs with stage B2 MMVD without echocardiography, using routine clinical data from 387 client-owned dogs (252 non-stage B2, 135 stage B2), including demographic, hematological, serum biochemical, urinalysis, and thoracic radiographic variables. A gradient boosting algorithm trained on 80% of the data and validated on the remaining 20% achieved an accuracy of 0.825, sensitivity of 0.815, specificity of 0.830, and an area under the ROC curve of 0.922. The authors concluded that this model could assist early detection and specialist referral of stage B2 disease when echocardiography is unavailable.", "clinical_takeaway_ko": "Echocardiography 장비나 숙련된 판독 인력이 바로 없는 상황에서도, 흉부 방사선을 포함한 기본 혈액검사·요검사 결과를 종합하면 stage B2 MMVD 가능성이 높은 개를 선별해 심장 전문의·초음파 의뢰 우선순위를 정하는 데 참고할 수 있다. 다만 이는 echocardiography를 대체하는 확진 도구가 아니라 의뢰 여부를 돕는 선별 도구로 이해해야 한다."}, {"pmid": "42797990", "title": "Preliminary Evaluation of Static and Kinematic Magnetic Resonance Imaging (MRI) of the Feline Temporomandibular Joint (TMJ): A Comparative Analysis of Joint Inclination Angles in Intact and Dislocated Conditions.", "journal": "Veterinary sciences", "year": "2026", "authors": ["Basma Abdelmohsen", "Francesca Del Signore", "Martina Rosto", "Elshaimaa Ismael", "Fouad Farag", "Massimo Vignoli"], "url": "https://pubmed.ncbi.nlm.nih.gov/42797990/", "doi": "10.1186/s43055-020-00396-8", "study_type": "실험 연구", "sample_size": "", "evidence_basis": "abstract", "species": ["cat"], "modality": ["MRI"], "system": ["head-neck"], "topics": ["head-neck-imaging"], "tags": ["cat", "MRI", "head-neck"], "added_on": "2026-09-30", "summary_ko": "기존 static MRI sequence는 관절 움직임·kinematics 정보를 제공하는 데 한계가 있어, 이 연구는 저자기장(0.25T) MRI 시스템으로 고양이 temporomandibular joint(TMJ)의 static MRI(T1W·T2W·3D sequence, closed-mouth·maximal interincisal opening(MIO) 자세)와 kinematic MRI(kMRI, 2D HYCE S sequence로 개폐 반복 동작 중 촬영)를 사체에서 비교했다. 일부 사체에서는 TMJ dislocation을 실험적으로 유발한 뒤 동일 프로토콜로 재촬영해 intact·dislocated 상태의 TMJ inclination angle을 비교했다. kMRI는 static MRI에 비해 motion artifact와 낮은 signal-to-noise ratio(SNR)로 인해 영상 품질이 떨어졌다. TMJ inclination angle은 mouth position(p<0.001)과 dislocation 여부(p=0.005) 모두에 유의하게 영향을 받았으며, MIO 자세에서 closed-mouth보다 각도가 유의하게 컸고 좌측 TMJ가 우측보다 유의하게 큰 각도를 보였다(p=0.012).", "summary_en": "Conventional static MRI sequences provide limited information on joint motion and kinematics, so this cadaveric study compared static MRI (T1W, T2W, and 3D sequences in closed-mouth and maximal interincisal opening [MIO] positions) with kinematic MRI (kMRI, a 2D HYCE S sequence acquired during repetitive mandibular opening/closing) of the feline temporomandibular joint (TMJ) using a low-field (0.25 T) system. In a subset of cadavers, TMJ dislocation was experimentally induced and the same protocol repeated to compare inclination angles between intact and dislocated joints. kMRI showed lower image quality than static MRI, mainly from motion artifacts and reduced signal-to-noise ratio (SNR). TMJ inclination angles were significantly affected by both mouth position (p < 0.001) and dislocation status (p = 0.005), with larger angles at MIO than closed-mouth and significantly greater inclination on the left TMJ than the right (p = 0.012).", "clinical_takeaway_ko": "현재 저자기장 kMRI는 static MRI보다 motion artifact·SNR 저하로 화질이 떨어지므로, 임상에서 TMJ dislocation이나 동적 이상이 의심되는 고양이는 우선 closed-mouth·MIO 두 자세의 static MRI로 inclination angle 변화를 비교하는 편이 현재로서는 더 신뢰할 수 있는 접근일 수 있다. 좌우 비대칭이 정상적으로도 나타날 수 있음을 염두에 두고 판독해야 한다."}, {"pmid": "42797900", "title": "Comparative Evaluation of Single-Voxel and Multi-Voxel Proton Magnetic Resonance Spectroscopy Using Small-Sized Voxels in Healthy Beagle Dogs: A Pilot Study.", "journal": "Veterinary sciences", "year": "2026", "authors": ["Jong Bong Lee", "Gunha Hwang", "Seokmin Lee", "Youngwon Lee", "Hojung Choi", "Hee Chun Lee", "Tae Sung Hwang"], "url": "https://pubmed.ncbi.nlm.nih.gov/42797900/", "doi": "10.1002/(SICI)1522-2594(200003)43:3<348::AID-MRM5>3.0.CO;2-M", "study_type": "실험 연구", "sample_size": "7", "evidence_basis": "abstract", "species": ["dog"], "modality": ["MRI"], "system": ["neuro"], "topics": ["neuro-imaging"], "tags": ["dog", "MRI", "neuro"], "added_on": "2026-09-30", "summary_ko": "건강한 Beagle 7마리를 1.5T 시스템으로 촬영해, 작은 voxel(0.125 cm³)을 이용한 single-voxel spectroscopy(SVS)와 multi-voxel spectroscopy(MVS)를 frontoparietal lobe의 white/gray matter, caudate nucleus, thalamus에서 비교했다. SVS의 평균 촬영 시간(4.79±0.29분)이 MVS(11.64±0.23분)보다 유의하게 짧았으며, 다중비교 보정 후 두 기법 간 대사물질 농도·creatine 대비 비율에 유의한 차이가 없었고 좌우 반구 간 차이도 없었다. 저자들은 작은 voxel을 이용한 SVS가 기술적으로 실현 가능하며 촬영 시간을 단축시킨다고 결론지었으나, 이는 건강한 소수 개체에서 얻은 프로토콜 특이적 기술 데이터로 임상 참고치나 진단 정확도를 제시하지는 않는다.", "summary_en": "Seven healthy Beagle dogs underwent 1.5T MRI to compare single-voxel spectroscopy (SVS) using small voxels (0.125 cm³) with multi-voxel spectroscopy (MVS) in the frontoparietal white and gray matter, caudate nucleus, and thalamus. SVS had a significantly shorter mean acquisition time (4.79 ± 0.29 min) than MVS (11.64 ± 0.23 min), and no significant differences in metabolite concentrations or creatine ratios were found between the two techniques after multiplicity correction, nor between hemispheres. The authors concluded that small-voxel SVS is technically feasible and time-efficient, though this remains protocol-specific descriptive data from a small healthy cohort rather than established clinical reference values or diagnostic performance.", "clinical_takeaway_ko": "임상 MRS 프로토콜에서 작은 voxel의 SVS를 사용하면 MVS와 대사물질 비율 측정치가 유사하면서 촬영 시간을 크게 줄일 수 있어, 마취 시간이 제한적인 환자에서 실용적 대안이 될 수 있다."}, {"pmid": "42797884", "title": "Interictal Single-Voxel Proton Magnetic Resonance Spectroscopy of the Temporal Lobe in Cats with Idiopathic Epilepsy: A Prospective Case-Control Study.", "journal": "Veterinary sciences", "year": "2026", "authors": ["Bertuğ Bekir Çiftçi", "Gültekin Atalan", "Mehmet Ulusan"], "url": "https://pubmed.ncbi.nlm.nih.gov/42797884/", "doi": "10.3390/ani15111504", "study_type": "전향적 연구", "sample_size": "40", "evidence_basis": "abstract", "species": ["cat"], "modality": ["MRI"], "system": ["neuro"], "topics": ["neuro-imaging"], "tags": ["cat", "MRI", "neuro"], "added_on": "2026-09-30", "summary_ko": "전형적으로 뇌 MRI가 정상 소견을 보이는 idiopathic epilepsy(IE) 고양이 20마리와 건강한 대조군 20마리를 대상으로 양측 temporal lobe(mid-hippocampus·amygdala 중심)의 interictal single-voxel 1H-MRS를 시행해 NAA/tCr, NAA/tCho, tCho/tCr, tCho/NAA 비율을 비교했다. 전체적으로는 두 군 간 유의한 대사물질 비율 차이가 없었지만, 우측 temporal lobe NAA/tCr 비율이 IE군에서 대조군보다 유의하게 낮았다(1.32±0.29 vs 1.50±0.20, p<0.05). 발작 시점도 좌측 반구 스펙트럼에 영향을 미쳐, 마지막 발작 이후 경과 시간이 짧을수록 좌측 tCho/tCr이 낮아졌고(Spearman r=-0.48, p=0.035) 최초-최종 발작 간격이 3일 이내인 개체는 그보다 긴 개체보다 좌측 NAA/tCho가 낮고(p=0.032) tCho/NAA가 높았다(p=0.039). 저자들은 겉보기에 정상인 MRI 뒤에 숨은 temporal lobe 대사 이상을 1H-MRS가 검출할 수 있는 보조 도구가 될 수 있다고 결론지었다.", "summary_en": "Twenty client-owned cats with idiopathic epilepsy (IE) and 20 healthy controls, all with unremarkable conventional MRI, underwent bilateral interictal single-voxel 1H-MRS centred on the mid-hippocampus and amygdala. Overall, no metabolite ratio differed significantly between groups, but the right temporal lobe NAA/tCr ratio was significantly lower in IE cats (1.32 ± 0.29) than controls (1.50 ± 0.20; p < 0.05). Seizure timing modulated the left-hemisphere spectrum: left tCho/tCr correlated negatively with time since the last seizure (Spearman r = -0.48; p = 0.035), and cats with ≤3 days between first and last seizures had lower left NAA/tCho (p = 0.032) and higher left tCho/NAA (p = 0.039) than cats with a longer interval. The authors propose 1H-MRS as a promising non-invasive adjunct for characterising temporal lobe metabolic disturbances in feline IE despite normal-appearing MRI.", "clinical_takeaway_ko": "MRI가 정상인 고양이 idiopathic epilepsy 증례에서도 1H-MRS로 우측 temporal lobe NAA/tCr 저하 등 대사 이상을 추가로 확인할 수 있어, 정밀 검사가 가능한 시설이라면 원인불명 발작 환자의 병태생리 평가에 MRS 추가를 고려할 수 있다."}, {"pmid": "42791713", "title": "Non-Oncological Progression of an Aneurysmal Bone Cyst (ABC) in a Puppy Following Surgical Treatment.", "journal": "Animals : an open access journal from MDPI", "year": "2026", "authors": ["Anna Michalska", "Jakub Kaczmarek", "Daniel Kaup", "Annika Lehmbecker", "Magdalena Morawska"], "url": "https://pubmed.ncbi.nlm.nih.gov/42791713/", "doi": "10.17221/7986-VETMED", "study_type": "증례보고", "sample_size": "1", "evidence_basis": "abstract", "species": ["dog"], "modality": ["radiography", "CT"], "system": ["musculoskeletal"], "topics": ["musculoskeletal-imaging"], "tags": ["dog", "radiography", "CT", "musculoskeletal"], "added_on": "2026-09-30", "summary_ko": "4개월령 Labrador Retriever의 좌측 ulna에 발생한 aneurysmal bone cyst(ABC)에서, radiography와 CT로 marked cortical thinning을 동반한 급속 진행성 expansile osteolytic lesion이 확인되었고 조직검사로 악성 소견 없이 ABC가 확진되었다. Corticotomy·intralesional curettage·자가골 이식·lag screw 고정으로 초기 수술을 시행했으나, 파행은 완전히 소실되었음에도 술 후 6주 감시 방사선 촬영에서 원래 수술 부위보다 근위쪽으로 병변이 진행한 것이 확인되었다. 더 큰 cortical window와 광범위한 curettage로 재수술(재확진 ABC, 악성 소견 없음)을 시행한 뒤 골 이식을 추가했고, 이후 35개월간의 연속 radiography·CT 추적에서 진행성 골 재형성이 확인되고 추가 진행·재발은 없었다.", "summary_en": "An aneurysmal bone cyst (ABC) affecting the left ulna of a four-month-old Labrador Retriever was evaluated with radiography and computed tomography, revealing a rapidly progressive, expansile osteolytic lesion with marked cortical thinning; histopathology confirmed ABC without malignancy. Initial treatment (corticotomy, intralesional curettage, autologous bone grafting, and lag-screw stabilization) resolved lameness clinically, but surveillance radiographs six weeks postoperatively showed lesion progression proximal to the original surgical site. Revision surgery with a larger cortical window and more extensive curettage (histopathology again confirming ABC without malignant transformation) was followed by bone grafting. Serial radiographic and CT follow-up over 35 months demonstrated progressive osseous remodeling with no further progression or recurrence.", "clinical_takeaway_ko": "어린 개에서 급속 진행성 expansile osteolytic lesion이 확인되면 ABC를 감별진단에 포함하고, 초기 수술 후 파행이 완전히 소실되었더라도 조기(예: 6주)에 감시 radiography로 재평가해 병변 진행 여부를 확인하는 것이 안전하다. 재발 시 더 넓은 범위의 curettage와 골 이식으로 장기적으로 양호한 골 재형성을 기대할 수 있다."}, {"pmid": "42791699", "title": "Patient-Specific Computational Fluid Dynamics of Pulmonary Arterial Hemodynamics in Dogs with and Without Pulmonic Stenosis.", "journal": "Animals : an open access journal from MDPI", "year": "2026", "authors": ["Carla Zamora-Perarnau", "Mauro Malvè", "Patricia Sebastián-Marcos", "Rocío Fernández-Parra"], "url": "https://pubmed.ncbi.nlm.nih.gov/42791699/", "doi": "10.1002/clc.23151", "study_type": "실험 연구", "sample_size": "10", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT", "echocardiography"], "system": ["cardiovascular"], "topics": ["cardiac-imaging"], "tags": ["dog", "CT", "echocardiography", "cardiovascular"], "added_on": "2026-09-30", "summary_ko": "Pulmonic stenosis(PS)는 개의 흔한 선천성 심장병이지만 echocardiography·contrast-enhanced CT angiography(CTA)만으로는 혈류역학적 결과를 온전히 파악하기 어렵다는 문제의식에서, PS가 있는 개 5마리와 없는 대조군 5마리의 CTA·echocardiography 자료로 3차원 폐동맥 형상을 재구성해 환자 맞춤형 computational fluid dynamics(CFD) 모델을 만들었다. PS군은 대조군보다 transvalvular pressure gradient·최대 혈류 속도·폐동맥 저항이 뚜렷하게 높았고, 고속 jet과 협착 후 국소 재순환(post-stenotic recirculation)이 대조군에는 없이 PS군에서만 관찰되었다. Mean wall shear stress(WSS)·time-averaged WSS(TAWSS)는 PS군에서 높아지는 경향을 보인 반면 oscillatory shear index(OSI)는 군 간 유사했고, relative residence time(RRT)은 PS군에서 유의하게 낮았다(p=0.032). 저자들은 CFD가 기존 영상검사를 보완하는 정보를 제공할 수 있으나, 정량적으로 정밀한 임상 적용 가능 수치를 제공하는 데에는 아직 한계가 있다고 결론지었다.", "summary_en": "Pulmonic stenosis (PS) is one of the most common congenital cardiac diseases in dogs, but echocardiography and contrast-enhanced CT angiography (CTA) alone incompletely characterize its hemodynamic consequences. Using CTA and echocardiographic data from five dogs with PS and five controls without PS, this study reconstructed three-dimensional pulmonary artery geometries to generate patient-specific computational fluid dynamics (CFD) models. Dogs with PS showed markedly increased transvalvular pressure gradients, peak flow velocities, and pulmonary artery resistance, with high-velocity jets and localized post-stenotic recirculation absent in controls. Mean wall shear stress (WSS) and time-averaged WSS (TAWSS) tended to be higher in the PS group, while oscillatory shear index (OSI) was similar between groups; relative residence time (RRT) was significantly lower in the PS group (p = 0.032). The authors concluded that patient-specific CFD provides information complementary to conventional imaging, though its ability to yield precise, clinically applicable quantitative values remains limited.", "clinical_takeaway_ko": "PS가 있는 개에서 CTA·echocardiography로 형상 정보를 얻어 CFD 모델을 만들면 압력차·혈류 속도 같은 기존 지표 외에 wall shear stress·국소 재순환 패턴 같은 혈류역학적 세부 정보를 추가로 확인할 수 있으나, 현재로서는 연구용 도구에 가까워 개별 환자의 수술·중재 결정을 CFD 수치만으로 내리기는 이르다. PS 중증도를 CTA로 평가할 때 협착 후 재순환·저항 변화가 있을 수 있음을 염두에 두는 정도로 참고할 수 있다."}, {"pmid": "42791684", "title": "Ultrasonographic Appearance of Acute Prostatitis and Prostatic Abscesses in Dogs.", "journal": "Animals : an open access journal from MDPI", "year": "2026", "authors": ["Stefano Spada", "Gaia Pagani", "Johannes Herbel", "Bianca Lourdes Frehner", "Joana Rodrigues Carvalho", "Hélène Jainek", "Martina Gavezzoli", "Andrea Major", "Sebastian Patrick Arlt"], "url": "https://pubmed.ncbi.nlm.nih.gov/42791684/", "doi": "10.1016/j.tvjl.2019.02.008", "study_type": "후향적 연구", "sample_size": "35", "evidence_basis": "abstract", "species": ["dog"], "modality": ["ultrasound"], "system": ["urogenital"], "topics": ["urogenital-imaging"], "tags": ["dog", "ultrasound", "urogenital"], "added_on": "2026-09-30", "summary_ko": "Prostatitis는 개에서 흔한 전립선 질환이지만 초음파 소견이 충분히 정리되어 있지 않다는 문제의식에서, 세포학 또는 조직학적으로 급성 prostatitis가 확진된 client-owned 개 35마리의 병력을 후향적으로 검토했다. 가장 흔한 초음파 소견은 실질 echotexture의 불균질, intraparenchymal cystic lesion, capsular edema, periprostatic steatitis, 전립선 엽 간 비대칭이었다. 35마리 중 25마리에서 prostatic abscess가 확인되었으며 크기·형태가 다양했고, abscess 직경은 체중과 양의 상관관계(p=0.001, rho=0.6), toxic granulation을 보이는 neutrophil 비율과는 음의 상관관계(p=0.02, rho=-0.4)를 보였다. 대부분의 개는 내과적 또는 내외과 병합 치료 후 회복했으며, 추적 검사에서 염증성 주변 변화는 호전되었으나 실질의 불균질한 echotexture는 자주 남았다.", "summary_en": "Prostatitis is one of the most common prostatic disorders in dogs, although its ultrasonographic features remain poorly characterized. This retrospective study reviewed the records of 35 client-owned dogs with cytologically or histologically confirmed acute prostatitis. The most common ultrasonographic findings were inhomogeneous parenchymal echotexture, intraparenchymal cystic lesions, capsular edema, periprostatic steatitis, and asymmetry of the prostatic lobes. Prostatic abscesses were detected in 25 of 35 dogs and showed marked variability in size and morphology. Abscess diameter was positively correlated with body weight (p = 0.001, rho = 0.6) and negatively correlated with the percentage of neutrophils showing toxic granulation (p = 0.02, rho = -0.4). Most dogs recovered following medical or combined medical-surgical treatment; follow-up examinations showed resolution of inflammatory periprostatic changes, whereas inhomogeneous parenchymal echotexture frequently persisted.", "clinical_takeaway_ko": "개에서 전립선 실질의 불균질 echotexture, intraparenchymal cystic lesion, capsular edema, periprostatic steatitis, 엽 간 비대칭이 동반된 경우 acute prostatitis·abscess를 우선 고려하고, 큰 체중의 개에서는 더 큰 abscess를 예상할 수 있다. 치료 후 추적 초음파에서 실질 echotexture 불균질이 남아있는 것은 흔한 소견이므로 이것만으로 치료 실패나 재발로 단정하지 않아야 한다."}, {"pmid": "42781373", "title": "Case Report: Repeated imaging and surgical treatment of a vascular hamartoma arising from the cervical vertebral column of a cat.", "journal": "Frontiers in veterinary science", "year": "2026", "authors": ["Annika Katharina Schmitz", "Gesine Buhmann", "Andrea Trapp", "Kaspar Matiasek", "Konrad Jurina"], "url": "https://pubmed.ncbi.nlm.nih.gov/42781373/", "doi": "10.5603/RPOR.a2023.0009", "study_type": "증례보고", "sample_size": "1", "evidence_basis": "abstract", "species": ["cat"], "modality": ["MRI", "CT"], "system": ["spine", "cardiovascular"], "topics": ["spinal-imaging", "vascular-imaging"], "tags": ["cat", "MRI", "CT", "spine", "cardiovascular"], "added_on": "2026-09-30", "summary_ko": "3세 중성화 수컷 Domestic Shorthair 고양이가 1년간 진행성 우측 편측 proprioceptive ataxia, ambulatory tetraparesis, cervical 통증을 보이다가 급격히 악화되어 내원했다. 신경학적 검사는 우측 C6-T2 myelopathy에 합당했고, MRI에서 C5 우측 lamina·vertebral body에서 기원한 골 증식을 동반한 우측 extradural myelocompressive lesion이 확인되어 심한 척수 압박과 좌측으로의 척수 편위를 일으켰다. 수술적 절제 후 조직병리로 vertebral vascular hamartoma가 확진되었으며, 술 후 일시적 악화를 거쳐 임상 증상은 호전되었다. 1년 후 신경학적 결손이 재발해 MRI·CT로 병변 재성장이 확인되었고, 2차 절제 후 조직병리에서 다시 vertebral vascular hamartoma가 확인되었다.", "summary_en": "A 3-year-old male neutered Domestic Shorthair cat presented with a 1-year history of progressive right-lateralized proprioceptive ataxia, ambulatory tetraparesis, and cervical spinal pain, with sudden deterioration shortly before presentation. Neurological examination was consistent with a right-sided C6-T2 myelopathy. MRI revealed a right-sided extradural myelocompressive lesion at the level of C5, associated with osseous proliferation arising from the right lamina and vertebral body, causing severe spinal cord compression and leftward spinal cord deviation. The mass was surgically resected, and histopathology confirmed a vertebral vascular hamartoma; clinical signs improved after a brief period of postoperative worsening. One year later, neurological deficits recurred, and MRI and CT confirmed regrowth of the vertebral lesion. A second surgical excision was performed, with histopathology again confirming vertebral vascular hamartoma.", "clinical_takeaway_ko": "젊은 고양이에서 진행성 편측 myelopathy와 함께 MRI상 골 증식을 동반한 extradural spinal cord compression이 보인다면 vertebral vascular hamartoma를 감별진단에 포함해야 하며, 수술적 절제가 불완전할 경우 재성장 가능성이 있으므로 술 후 신경학적 결손 재발 시 MRI·CT를 이용한 재평가를 고려해야 한다."}, {"pmid": "42775486", "title": "Computed tomographic Characteristics of Presumed Normal Canine Iliosacral Lymph Nodes.", "journal": "Veterinary radiology & ultrasound", "year": "2026", "authors": ["Mohammad Momin Iqbal", "Monique Mayer", "Amy Larkin", "Sarah Parker", "Sally Sukut"], "url": "https://pubmed.ncbi.nlm.nih.gov/42775486/", "doi": "10.3906/vet-1507-78", "study_type": "후향적 연구", "sample_size": "71", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT"], "system": ["oncology"], "topics": ["oncologic-imaging"], "tags": ["dog", "CT", "oncology"], "added_on": "2026-09-30", "summary_ko": "개 71마리의 CT 영상을 ACVR 인증 영상의학전문의가 후향적으로 검토해 medial iliac(MILN)·internal iliac(IILN)·sacral(SLN) lymph node의 최소·최대 횡경(MinTD/MaxTD) 정상 참고치를 산출했다. MILN은 99%, IILN은 79%, SLN은 41%에서 확인되었고, 중앙값 MinTD/MaxTD는 MILN 4.2/7.4mm, IILN 2.5/4.0mm, SLN 2.9/4.9mm였다. MaxTD는 MILN의 19%·IILN의 1%에서 RECIST v1.1 기준 10mm를 초과했지만 MinTD는 거의 모든 림프절에서 10mm 미만이어서, 저자들은 치료반응 평가 시 MaxTD보다 MinTD가 RECIST v1.1의 비병적 림프절 정의(<10mm)에 더 부합한다고 결론지었다. 중성화하지 않은 개에서 대부분의 횡경이 더 컸고(p≤0.013), 대동맥 직경과 체중이 양의 상관관계를 보였으며 대동맥 직경 8.6mm 초과 개체는 MILN·IILN 직경이 더 컸다(p≤0.034).", "summary_en": "CT scans from 71 dogs were retrospectively reviewed by an ACVR-certified veterinary radiologist to establish minimum and maximum transverse diameter (MinTD/MaxTD) reference values for presumed normal medial iliac (MILN), internal iliac (IILN), and sacral (SLN) lymph nodes. MILNs were identified in 99% of dogs, IILNs in 79%, and SLNs in 41%. Median MinTD/MaxTD were 4.2/7.4 mm (MILN), 2.5/4.0 mm (IILN), and 2.9/4.9 mm (SLN). MaxTD exceeded the RECIST v1.1 10 mm threshold in 19% of MILN sites and 1% of IILN sites, while MinTD stayed below 10 mm in nearly all nodes, leading the authors to recommend MinTD as the preferred measurement for RECIST v1.1-based therapeutic response evaluation. Intact dogs had larger diameters for most measures (p ≤ 0.013), and aortic diameter correlated with body weight and larger MILN/IILN diameters.", "clinical_takeaway_ko": "종양 병기 결정이나 RECIST v1.1 기반 치료반응 평가 시 iliosacral lymph node를 판독할 때 MaxTD보다 MinTD를 기준으로 삼는 것이 정상/병적 판단의 위양성을 줄일 수 있으며, 중성화 여부·대동맥 직경 등 개체 특성에 따라 정상 범위가 달라질 수 있음을 고려해야 한다."}, {"pmid": "42803120", "title": "EXPRESS: Echocardiographic prevalence and attachment-site patterns of left ventricular bands in cats.", "journal": "Journal of feline medicine and surgery", "year": "2026", "authors": ["Gregory Van den Noortgate", "Yury Zablotski", "Gerhard Wess"], "url": "https://pubmed.ncbi.nlm.nih.gov/42803120/", "doi": "10.1177/1098612X261495725", "study_type": "전향적 연구", "sample_size": "200", "evidence_basis": "abstract", "species": ["cat"], "modality": ["echocardiography"], "system": ["cardiovascular"], "topics": ["cardiac-imaging"], "tags": ["cat", "echocardiography", "cardiovascular"], "added_on": "2026-09-29", "summary_ko": "Left ventricular band(LVB)는 mitral valve leaflet에 붙지 않고 좌심실 내 두 심근 구조를 잇는 선상 구조물이다. Transthoracic echocardiography를 받은 고양이 200마리를 대상으로 한 전향적 관찰 연구에서 199/200마리(99.5%)에서 최소 1개 이상의 LVB가 확인되었고, 마리당 중앙값 4개(범위 0~10)였다. 총 884개의 LVB 중 51.9%가 interventricular septum에 부착부를 가졌고 94.3%는 papillary muscle 또는 accessory papillary muscle-like 구조와 연관되었다. LVB 개수는 성별(P=0.47), 진정 여부(P=0.26), 정상/국소 삽입부 비후군과 hypertrophic cardiomyopathy(HCM) 표현형군 간(P=0.98) 모두 유의한 차이가 없었다.", "summary_en": "Left ventricular bands (LVBs) are discrete intracavitary linear structures connecting two myocardial structures within the left ventricle without insertion into the mitral valve leaflets. In this prospective observational study of 200 cats undergoing transthoracic echocardiography, at least one LVB was detected in 199/200 cats (99.5% prevalence), with a median of 4 LVBs per cat (range 0-10). Of 884 total LVBs identified, 51.9% had at least one septal attachment and 94.3% involved a papillary muscle or accessory papillary muscle-like structure. LVB counts did not differ significantly by sex (P=0.47), sedation status (P=0.26), or between the normal/focal insertion-site thickening group and the hypertrophic cardiomyopathy (HCM) phenotype group (P=0.98).", "clinical_takeaway_ko": "고양이 심초음파에서 좌심실 내 선상 구조물(LVB)은 거의 모든 개체에서 관찰되는 정상 변이이므로, mitral valve leaflet에 부착되지 않은 septal-papillary muscle 간 밴드를 우연히 발견했다고 해서 병적 소견이나 HCM 관련 소견으로 과대 해석하지 않도록 주의해야 한다."}, {"pmid": "42786736", "title": "EXPRESS: Meningiomas in four cats with pseudocystic fluid accumulation including one microcystic meningioma.", "journal": "Journal of feline medicine and surgery", "year": "2026", "authors": ["Alexandre Bitoun", "Clémence Berthomé", "Hadrien Frankar", "Sabrina Fert", "Laurent Cauzinille"], "url": "https://pubmed.ncbi.nlm.nih.gov/42786736/", "doi": "10.1177/1098612X261494688", "study_type": "증례군", "sample_size": "4", "evidence_basis": "abstract", "species": ["cat"], "modality": ["MRI"], "system": ["neuro", "oncology"], "topics": ["neuro-imaging"], "tags": ["cat", "MRI", "neuro", "oncology"], "added_on": "2026-09-29", "summary_ko": "진행성 prosencephalic 증상을 보인 고양이 4마리에서 MRI상 extraaxial mass에 동반된 pseudocystic fluid accumulation이 확인되어 pseudocystic meningioma가 의심되었다. Case 1은 실제 cyst에 가까운 양상이었고, Case 2·3·4는 crescent 모양으로 subdural fluid accumulation에 더 부합했다. 4마리 모두 craniotomy로 종양을 제거했으며, 조직학적으로 Case 1·2·4는 fibrous meningioma, Case 3는 microcystic meningioma로 분류되었다(수의학 문헌에 처음 보고). Case 4의 낭액 분석에서는 단백 함량이 높고 종양성 meningeal cell이 확인되었으며, 낭벽 조직학상 상피 lining 없이 dura mater에 접한 종양성 meningothelial cell이 관찰되었다. 4마리 모두 수술 후 신경학적으로 호전되었고, Case 2·3의 6개월 추적 MRI에서는 국소 뇌막 비후가 관찰되었다.", "summary_en": "Four cats presenting with progressive prosencephalic signs had an extraaxial mass with an associated pseudocystic component on MRI, raising suspicion for pseudocystic meningioma. Case 1's fluid accumulation resembled a true cyst, whereas Cases 2, 3, and 4 showed a crescent-shaped pattern more consistent with subdural fluid accumulation. All four cats underwent tumor removal via craniotomy. Histologically, the meningiomas were classified as fibrous in Cases 1, 2, and 4, and as microcystic in Case 3 (the first such report in the veterinary literature). Fluid analysis in Case 4 revealed protein-rich fluid with neoplastic meningeal cells, and histology of the cyst wall showed tumoral meningothelial cells lining the dura mater without an epithelial lining. All cats improved neurologically after surgery, and follow-up MRI in Cases 2 and 3 at 6 months postoperatively showed focal meningeal thickening.", "clinical_takeaway_ko": "고양이에서 extraaxial mass에 pseudocystic fluid accumulation이 동반된 경우 meningioma(fibrous 또는 드물게 microcystic형)를 감별진단에 포함하고, crescent 모양이면 실제 cyst보다는 subdural fluid accumulation 가능성을 먼저 고려하는 것이 합리적이다. 수술 후 6개월 추적 MRI에서 국소 뇌막 비후가 관찰될 수 있으나 이 증례들에서는 임상 경과에 영향을 주지 않았다."}, {"pmid": "42772030", "title": "Two-dimensional shear wave elastography assessment of testicular stiffness in healthy cats.", "journal": "Theriogenology", "year": "2026", "authors": ["Viola Zappone", "Simona Gurrì", "Roberta Bucci", "Alessandra Caprì", "Romina Marcoccia", "Nicola Iannelli", "Tiziana Caspanello", "Giulio Guido Aiudi", "Massimo De Majo", "Marco Quartuccio"], "url": "https://pubmed.ncbi.nlm.nih.gov/42772030/", "doi": "10.1016/j.theriogenology.2026.118206", "study_type": "전향적 연구", "sample_size": "19", "evidence_basis": "abstract", "species": ["cat"], "modality": ["ultrasound"], "system": ["urogenital"], "topics": ["urogenital-imaging"], "tags": ["cat", "ultrasound", "urogenital"], "added_on": "2026-09-29", "summary_ko": "건강한 고양이의 정상 고환 강성(stiffness) 기준값이 아직 확립되지 않은 가운데, 선택적 양측 orchiectomy를 위해 내원한 중성화하지 않은 수컷 고양이 19마리를 대상으로 수술 전 B-mode·Doppler·2D shear wave elastography(2D-SWE) 검사를 시행했다. 종축 스캔에서 testicular mediastinum 상하에 각각 2개씩의 원형 region of interest(ROI)를 두고 전체 고환을 포괄하는 ROI도 함께 측정해 shear wave speed(SWS)를 비교했다. 조직병리로 모든 예에서 정상 고환 조직이 확인되었으며, 평균 SWS는 우측 2.45±0.62m/s, 좌측 2.73±0.51m/s로 좌우 차이가 없었고(p=0.097), submediastinal(2.51±0.55m/s)과 supramediastinal(2.66±0.42m/s) 영역 간에도 유의한 차이가 없었다(p=0.129). 전체·submediastinal·supramediastinal ROI 방식 간에도 유의한 차이가 없었다(p=0.080). 국소 ROI와 확장 ROI 간 탐색적 일치도 분석에서는 평균 편향이 작았으나 상호 대체 가능성까지 입증하지는 못했다.", "summary_en": "Reference values for testicular stiffness in healthy cats have not been well established. This study characterized testicular stiffness using two-dimensional shear wave elastography (2D-SWE) in 19 client-owned intact male cats presented for elective bilateral orchiectomy, using B-mode, Doppler, and 2D-SWE with a linear transducer before surgery. In longitudinal scans, two circular regions of interest (ROIs) were placed above and two below the testicular mediastinum, along with a whole-testis ROI, to compare mean shear wave speed (SWS). Histopathology confirmed normal testicular tissue in all cases. Mean SWS was 2.45 ± 0.62 m/s in the right testis and 2.73 ± 0.51 m/s in the left, with no significant side difference (p = 0.097), and no significant difference between submediastinal (2.51 ± 0.55 m/s) and supramediastinal (2.66 ± 0.42 m/s) regions (p = 0.129) or among whole-testis, submediastinal, and supramediastinal ROI approaches (p = 0.080). Exploratory agreement analysis between focal and extended ROI approaches showed small mean biases but did not establish interchangeability.", "clinical_takeaway_ko": "고양이 고환 2D-SWE에서 좌우, mediastinum 상하, ROI 크기(국소 vs 전체 고환)에 따른 강성 차이가 뚜렷하지 않으므로, 정상 대조값으로는 어느 위치에서 측정하든 큰 편차 없이 사용할 수 있을 가능성을 시사한다. 다만 이 연구가 제시한 SWS 값(2.4~2.7m/s대)은 정상 소견 판단의 출발점일 뿐이며, 고환 질환 감별을 위한 cut-off로 쓰기 위해서는 질환군과의 비교 연구가 필요하다."}, {"pmid": "42770669", "title": "Staged caval occlusion enabling en bloc right divisional hepatectomy in two dogs with hepatocellular carcinoma.", "journal": "Veterinary surgery : VS", "year": "2026", "authors": ["Kumiko Ishigaki", "Kazushi Asano"], "url": "https://pubmed.ncbi.nlm.nih.gov/42770669/", "doi": "10.1111/vsu.70143", "study_type": "증례보고", "sample_size": "2", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT", "interventional"], "system": ["hepatobiliary", "cardiovascular", "oncology"], "topics": ["vascular-imaging", "abdominal-imaging"], "tags": ["dog", "CT", "interventional", "hepatobiliary", "cardiovascular", "oncology"], "added_on": "2026-09-29", "summary_ko": "Right divisional hepatocellular carcinoma(HCC)가 caudal vena cava(CVC)를 압박하거나 침범해 기존 collateral venous return이 없던 개 2마리(11세 중성화 수컷, Siberian Husky·Shih Tzu)에서, en bloc right divisional hepatectomy와 segmental CVC resection을 가능하게 하기 위해 staged pre-renal CVC occlusion을 시행했다. CT에서 각각 91.8×122.3×101.4mm, 77.0×94.8×70.2mm 크기의 right divisional mass와 CVC 압박/침범이 확인되었고, 경피적으로 조절 가능한 hydraulic occluder를 pre-renal CVC 주위에 삽입한 뒤 saphenous venous pressure·신장 수치·뒷다리 부종을 모니터링하며 외래에서 79일과 44일에 걸쳐 점진적으로 폐쇄했다. CT로 완전 폐쇄와 collateralization을 확인한 뒤 en bloc 우엽 절제·CVC 분절 절제를 시행했으며, 두 마리 모두 육안적 완전 절제와 조직학적 HCC 완전 절제가 확인되었다. 합병증은 경미했고(일시적 창상 삼출, 일시적 복수), 수술 후 생존 기간은 각각 352일과 2467일이었다.", "summary_en": "In two dogs (11-year-old neutered males, a Siberian Husky and a Shih Tzu) with right divisional hepatocellular carcinoma (HCC) causing caudal vena cava (CVC) compression or involvement without pre-existing collateral venous return, staged pre-renal CVC occlusion was performed to enable en bloc right divisional hepatectomy with segmental CVC resection. CT showed right divisional masses (91.8 × 122.3 × 101.4 mm and 77.0 × 94.8 × 70.2 mm, respectively) with CVC compression or involvement. A percutaneously controlled hydraulic occluder was placed around the pre-renal CVC, and gradual outpatient occlusion was performed over 79 and 44 days while monitoring saphenous venous pressure, renal values, and hindlimb edema. Complete CVC occlusion and collateralization were confirmed by CT before en bloc right divisional hepatectomy with segmental CVC resection. Macroscopically and histologically complete HCC resection was achieved in both dogs, with only transient morbidity (wound exudation in one, transient ascites in the other). Survival after hepatectomy was 352 and 2467 days.", "clinical_takeaway_ko": "CVC를 압박하거나 침범한 right divisional HCC에서 기존 collateral venous return이 없어 즉시 절제가 위험한 경우, CT로 종양 범위와 CVC 침범을 평가한 뒤 percutaneous hydraulic occluder로 pre-renal CVC를 단계적으로 폐쇄하고 CT로 완전 폐쇄·collateralization을 확인하는 접근이 선별된 증례에서 안전한 en bloc 절제로 이어질 수 있음을 시사한다. 이 술식을 고려하는 경우 술 전 CT가 종양 크기·CVC 침범 정도 평가뿐 아니라 폐쇄 진행 상태를 추적하는 데에도 핵심적인 역할을 한다."}, {"pmid": "42767266", "title": "Zurich Mini Cementless Total Hip Replacement in Cats: Specific Considerations and Short-Term Outcomes in 11 Cats (17 Hips).", "journal": "Veterinary and comparative orthopaedics and traumatology : V.C.O.T", "year": "2026", "authors": ["Bertrand Vedrine"], "url": "https://pubmed.ncbi.nlm.nih.gov/42767266/", "doi": "10.1055/a-2956-0882", "study_type": "후향적 연구", "sample_size": "11", "evidence_basis": "abstract", "species": ["cat"], "modality": ["radiography", "fluoroscopy"], "system": ["musculoskeletal"], "topics": ["musculoskeletal-imaging"], "tags": ["cat", "radiography", "fluoroscopy", "musculoskeletal"], "added_on": "2026-09-22", "summary_ko": "고양이는 acetabular retroversion 제한, femoral canal-acetabulum 크기 불일치, slipped capital femoral epiphysis(SCFE)에 따른 sclerosis 등 종 특이적 해부 특성 때문에 total hip replacement(THR)가 드물게 시행된다. 이 후향적 연구는 2022~2025년 Maine Coon 9마리·Domestic Shorthair 2마리(총 11마리, 17 hips)에서 시행한 cementless Zurich Mini THR의 임상·방사선 결과를 보고했다. 적응증은 SCFE 11례, hip dysplasia 5례, femoral neck fracture malunion 1례였다. Intraoperative fluoroscopy로 cup 위치를 최적화했으며, 수술 중 경미한 cortical fissure 2례는 예방적 cerclage wire로 안정화했다. 수술 후 femoral fracture 2례(11.8%, 그중 1례는 절단으로 이어짐)와 수술과 무관한 것으로 판단된 외상성 고관절 탈구 1례(10개월 후)가 발생했다. 8주째 남은 임플란트는 모두 통증 없이 안정적이었고 방사선상 완전~진행성 osteointegration을 보였다.", "summary_en": "Total hip replacement (THR) in cats is uncommon due to species-specific anatomical features including limited acetabular retroversion, femoral canal-acetabulum size mismatch, and sclerosis secondary to slipped capital femoral epiphysis (SCFE). This retrospective study reports clinical and radiographic outcomes of 17 cementless Zurich Mini THR procedures in 11 cats (9 Maine Coons, 2 Domestic Shorthairs) performed 2022-2025, for SCFE (n=11), hip dysplasia (n=5), and femoral neck fracture malunion (n=1). Intraoperative fluoroscopy was used to optimize cup positioning. Two intraoperative cortical fissures were stabilized with prophylactic cerclage wires. Postoperative complications included two femoral fractures (11.8%, one resulting in amputation) and one traumatic hip luxation at 10 months, deemed unrelated to surgery. At 8 weeks, all remaining implants were pain-free, stable, and showed complete or advanced osteointegration on radiographs.", "clinical_takeaway_ko": "SCFE나 hip dysplasia가 있는 고양이에서 THR을 고려할 때 intraoperative fluoroscopy로 cup 위치를 확인하는 것이 유용하며, 술후 방사선 추적에서 8주 시점 osteointegration 진행 여부를 통해 임플란트 안정성을 판단할 수 있다. 다만 femoral fracture(11.8%)가 드물지 않은 합병증으로 술후 방사선 평가 시 주의가 필요하다."}, {"pmid": "42765932", "title": "Educational utility of a 3D-printed canine hepatic artery phantom for CT bolus tracking training.", "journal": "Alternatives to laboratory animals : ATLA", "year": "2026", "authors": ["Keonyeong Min", "Dongwoo Chang", "Namsoon Lee"], "url": "https://pubmed.ncbi.nlm.nih.gov/42765932/", "doi": "10.1177/02611929261489758", "study_type": "실험 연구", "sample_size": "18", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT", "contrast-study"], "system": ["hepatobiliary", "technique"], "topics": ["imaging-technique-safety"], "tags": ["dog", "CT", "contrast-study", "hepatobiliary", "technique"], "added_on": "2026-09-22", "summary_ko": "CT angiography(CTA)에서 bolus tracking은 습득 난이도가 높고 시간 창(temporal window)이 좁아 초심자가 숙달하기 어려운 술기다. 이 연구는 생리적 조영제 동태를 재현하는 peristaltic pump 폐회로에 결합한 3D 프린팅 개 hepatic artery 팬텀을 시뮬레이터 기반 훈련 도구로 활용해 CT bolus tracking 숙련도 향상 효과를 평가했다. 경력 수준별(A: 숙련, B: 중급, C: 초심자)로 층화된 참여자 18명이 표준화된 bolus tracking 프로토콜을 3회 반복 시행했다. B·C군에서는 총 조작 시간이 유의하게 단축된 반면 A군은 유의하지 않은 감소를 보였다. 모든 군에서 region of interest(ROI) 배치 시간이 유의하게 개선되었고, 개념 이해도·술기 자신감·해부학적 인지에 대한 주관적 평가도 유의하게 향상되었다.", "summary_en": "Bolus tracking for CT angiography (CTA) has a steep learning curve and a narrow temporal window, making it challenging for novice trainees. This study evaluated a 3D-printed canine hepatic artery phantom, integrated into a closed-loop circuit with a peristaltic pump to replicate physiologic contrast kinetics, as a simulator-based training tool. Eighteen participants stratified by experience level (A: experienced, B: intermediate, C: beginner) completed three repeated trials of a standardized bolus tracking protocol. Total operation time significantly decreased in Groups B and C, while Group A showed a non-significant reduction. ROI placement time improved significantly across all groups, along with significant gains in self-reported conceptual understanding, procedural confidence, and anatomical recognition.", "clinical_takeaway_ko": "CT bolus tracking을 새로 훈련하는 인턴·전공의나 테크니션에게는 3D 프린팅 hepatic artery 팬텀 기반 시뮬레이션 훈련이 실제 환자 조영 CT 촬영 전 ROI 배치·타이밍 판단 능력을 안전하게 반복 연습시키는 실무적 대안이 될 수 있다."}, {"pmid": "42765741", "title": "Electroencephalography-functional magnetic resonance imaging using a familial temporal lobe epilepsy model in cats: an exploratory methodological pilot study.", "journal": "Journal of veterinary internal medicine", "year": "2026", "authors": ["Takayuki Miura", "Rikako Asada", "Daisuke Hasegawa"], "url": "https://pubmed.ncbi.nlm.nih.gov/42765741/", "doi": "10.3389/fnsys.2022.934266", "study_type": "실험 연구", "sample_size": "10 (30 세션)", "evidence_basis": "abstract", "species": ["cat"], "modality": ["MRI"], "system": ["neuro"], "topics": ["neuro-imaging"], "tags": ["cat", "MRI", "neuro"], "added_on": "2026-09-22", "summary_ko": "수의영상의학에서 epileptogenic zone(EZ) 국소화를 위한 신뢰할 만한 방법은 제한적이다. 사람 의학에서는 intracranial EEG가 가장 신뢰도 높은 방법이나, 비침습적인 EEG-functional MRI(EEG-fMRI) 동시 시행이 대안으로 쓰인다. 이 연구는 amygdalo-hippocampal 침범이 시사된 familial spontaneous epilepsy(FSEC) 콜로니에서 scalp EEG상 뚜렷한 interictal epileptiform discharge를 보인 고양이 10마리를 대상으로, 각 3회씩 scalp EEG·EEG-fMRI 세션(총 30세션)을 시행해 방법론적 실행 가능성을 평가했다. Blood oxygen level-dependent(BOLD) 활성화는 모든 세션에서 exploratory threshold 수준에서는 확인되었으나 다중비교 보정 후에는 유의한 활성화가 남지 않았다. Small-volume correction(SVC) 분석에서는 30세션 중 16세션에서 amygdalo-hippocampal 활성화가 확인되었고, 군집 수준 분석에서는 좌측 parahippocampal gyrus에서 hippocampal body로 이어지는 가장 큰 cluster가 확인되었다.", "summary_en": "Reliable methods for identifying the epileptogenic zone (EZ) remain limited in veterinary medicine. While intracranial EEG is considered most dependable in human medicine, noninvasive simultaneous EEG and functional MRI (EEG-fMRI) offers an alternative. This study evaluated the methodological feasibility of EEG-fMRI in 10 cats with clear interictal epileptiform discharges on scalp EEG, selected from a familial spontaneous epilepsy (FSEC) colony with previously suggested amygdalo-hippocampal involvement. Each cat underwent 3 scalp EEG and EEG-fMRI sessions (30 sessions total). Blood oxygen level-dependent (BOLD) activation was detected in all sessions at an exploratory threshold, but none survived correction for multiple comparisons. Small-volume correction (SVC) analysis identified amygdalo-hippocampal activation in 16 of 30 sessions, and group-level analysis identified the largest cluster extending from the left parahippocampal
