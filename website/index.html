l anatomy with contrast-enhanced computed tomography and 3D reconstruction.", "journal": "Research in veterinary science", "year": "2026", "authors": ["Basma Abdelmohsen", "Ramadan Sary", "Yara Abouelela", "Samer Daghash", "Fouad Farag"], "url": "https://pubmed.ncbi.nlm.nih.gov/42710191/", "doi": "10.1016/j.rvsc.2026.106389", "study_type": "실험 연구", "sample_size": "10", "evidence_basis": "abstract", "species": ["cat"], "modality": ["CT"], "system": ["thorax", "abdomen"], "topics": ["abdominal-imaging", "thoracic-imaging"], "tags": ["cat", "CT", "thorax", "abdomen"], "added_on": "2026-09-21", "summary_ko": "성체 고양이 10마리를 대상으로 흉복부 단면 해부와 조영증강 CT, 3차원(3D) 재구성 영상을 상호 대조해 상세한 해부학 atlas를 제작했다. 5마리는 정해진 흉복부 절단면에서 신선·고정 상태로 절편을 만들어 관찰했고, 나머지 5마리는 요오드 조영제 정맥주사 후 단순·조영증강 CT를 시행해 DICOM 데이터를 3D 재구성(흉곽 골격, 심장, 주요 혈관, 복부 장기)했다. 흉복부의 주요 골격·근육·장기·혈관 구조가 해부학적 절편과 CT 영상 간에 모두 식별·대조되었으며, 조영증강 CT는 특히 혈관 해부와 장기 간 관계의 시인성을 크게 향상시켰다. 저자들은 이 해부학·영상·3D 재구성 atlas가 수의학 해부 교육, 영상 판독, 수술 계획에 신뢰할 만한 참고자료가 될 것이라고 결론지었다.", "summary_en": "This anatomical study developed a detailed atlas of the feline thorax and abdomen in 10 adult domestic cats by correlating cross-sectional anatomical slices with contrast-enhanced CT images and three-dimensional (3D) reconstructions. Five cats were serially sectioned at defined thoracic and abdominal levels (examined fresh and fixed), while the remaining five underwent plain and contrast-enhanced CT after intravenous iodinated contrast administration, with CT datasets reconstructed in 3D (thoracic skeleton, heart, major vessels, abdominal viscera). All major bones, muscles, visceral organs, and vascular structures were successfully identified and correlated between anatomical sections and CT images, with contrast-enhanced CT markedly improving visualization of vascular anatomy and visceral relationships. The authors conclude this atlas provides a reliable reference for veterinary anatomy education, diagnostic imaging interpretation, and surgical planning in cats.", "clinical_takeaway_ko": "고양이 흉복부 CT를 판독하거나 수술 계획을 세울 때, 이 연구의 단면-CT-3D 재구성 대조 atlas를 정상 해부 기준 참고자료로 활용할 수 있다."}, {"pmid": "42705596", "title": "Mechanistic-data synergy for predicting fracture load in canine bone with appendicular osteosarcoma.", "journal": "Veterinary journal (London, England : 1997)", "year": "2026", "authors": ["Behzad Amirzade", "Tareq Zobaer", "Janis Lapsley", "Kim A Selting", "Laura E Selmic", "Ali Nassiri"], "url": "https://pubmed.ncbi.nlm.nih.gov/42705596/", "doi": "10.1016/j.tvjl.2026.106873", "study_type": "실험 연구", "sample_size": "16", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT"], "system": ["musculoskeletal", "oncology", "AI"], "topics": ["musculoskeletal-imaging", "ai-imaging"], "tags": ["dog", "CT", "musculoskeletal", "oncology", "AI"], "added_on": "2026-09-21", "summary_ko": "Appendicular osteosarcoma를 가진 개 16마리의 CT 영상에서 재구성한 이질적(heterogeneous) elasto-plastic 물성치를 가진 물리 기반 뼈 모델을 이용해, 고신뢰도 Finite Element Analysis(FEA)·XFEM 시뮬레이션(25가지 하중 조건, medullary conformal stabilization 유무)으로 825개의 crack-initiation load 데이터를 생성했다. 이 시뮬레이션 데이터로 MLP, SVR, RF, XGBoost, HistGBR 등 5가지 머신러닝 모델을 학습시켜 체중, 병변 위치, 뼈 길이 등과 골절 하중의 관계를 예측하도록 했으며, XGBoost가 held-out 165건에서 평균 R²≈0.90, 정규화 평균절대오차 약 8%로 가장 우수했다. 병변 부담(lesion burden)과 체중이 가장 중요한 예측 인자였고, humerus 증례에서 tibia·radius보다 환자 단위 예측 성능이 더 일관됐다.", "summary_en": "Using CT-derived, physics-faithful bone models with heterogeneous elasto-plastic material properties from 16 dogs with appendicular osteosarcoma, this study generated 825 crack-initiation load values via high-fidelity Finite Element Analysis (FEA) and XFEM simulations across 25 loading scenarios, with and without medullary conformal stabilization. Five machine learning models (MLP, SVR, RF, XGBoost, HistGBR) were trained on these simulation-derived targets plus biological/morphometric features; XGBoost achieved the best performance on 165 held-out cases (average R²≈0.90, ~8% normalized mean absolute error). Lesion burden and body weight were the dominant predictors, with more consistent patient-level performance for humeral than tibial/radial cases.", "clinical_takeaway_ko": "현재는 개념 증명(proof-of-concept) 단계이지만, CT 영상에서 추출한 뼈 형상·물성 데이터를 이용한 ML 골절 하중 예측이 향후 osteosarcoma 환자의 예방적 내고정 필요성 판단을 보조하는 정량 도구로 발전할 가능성이 있다 — 제한적 근거."}, {"pmid": "42644764", "title": "Bunny Burrito Restraint for Computed Tomography in Conscious Rabbits: An Effective Alternative.", "journal": "Veterinary Radiology & Ultrasound", "year": "2026", "authors": ["Hung-Ting Liu", "Jonathan Olijnyk", "Jessica Ingman", "Ellen Sundberg", "Laetitia Volait-Rosset", "Alexis Gombert"], "url": "https://pubmed.ncbi.nlm.nih.gov/42644764/", "doi": "10.1111/vru.70230", "study_type": "후향적 연구", "sample_size": "93", "evidence_basis": "abstract", "species": ["rabbit"], "modality": ["CT"], "system": ["sedation-restraint", "dental"], "topics": ["sedation-restraint-imaging"], "tags": ["rabbit", "CT", "sedation-restraint", "dental"], "added_on": "2026-09-13", "summary_ko": "2021년 3월부터 2023년 12월까지 보호자 소유 토끼 93마리를 대상으로 진행된 후향적 다기관 관찰연구에서, conscious rabbit의 CT 검사 시 bunny burrito(수건으로 감싸는 보정법)와 plexiglass chamber 보정법, sedation을 비교했다. bunny burrito 그룹(36마리)은 plexiglass chamber 그룹(47마리)에 비해 pre-contrast 영상에서 motion artifact가 유의하게 적었고(p=0.02), dental disease 하위군에서 positioning이 더 우수했으며(p=0.03), post-contrast 초기 안정성도 더 좋았다(p=0.04, 신뢰구간 넓음). bunny burrito와 sedation(10마리) 간 영상 품질은 기술통계상 유사했으며, 검사 중이나 이후 합병증은 보고되지 않았다. 저자들은 bunny burrito 보정법이 plexiglass chamber보다 특정 상황에서 우수하며, sedation에 따른 위험 없이 CT 검사 접근성을 높이는 유효하고 안전한 대안이라고 결론지었다.", "summary_en": "This retrospective multicenter study evaluated the bunny burrito restraint technique as an alternative to plexiglass chamber restraint for CT imaging in 93 conscious client-owned rabbits (2021-2023). The bunny burrito group (n=36) showed significantly fewer motion artifacts in pre-contrast acquisitions, better positioning in the dental disease subgroup, and better early post-contrast stability compared to the plexiglass chamber group (n=47). Image quality was descriptively similar between bunny burrito and sedation (n=10), with no complications reported in either physical restraint group. The findings support bunny burrito restraint as a safe, effective, low-equipment alternative that reduces sedation-related risk in rabbit CT imaging.", "clinical_takeaway_ko": "토끼 CT 검사에서 sedation이 어렵거나 위험도가 높은 환자라면 bunny burrito 보정법을 우선 고려할 수 있으며, 특히 dental disease 평가 시 plexiglass chamber보다 positioning 안정성이 우수하다."}, {"pmid": "42593822", "title": "Bibliometric Analysis of Artificial Intelligence Use in Small Animal Thoracic Radiography.", "journal": "Veterinary Medicine and Science", "year": "2026", "authors": ["Vildan Aslan Canatan", "Ender Uzabaci"], "url": "https://pubmed.ncbi.nlm.nih.gov/42593822/", "doi": "10.29106/fesa.1302809", "study_type": "기타", "sample_size": "27", "evidence_basis": "abstract", "species": ["dog", "cat"], "modality": ["radiography"], "system": ["thorax", "AI"], "topics": ["ai-imaging"], "tags": ["dog", "cat", "radiography", "thorax", "AI"], "added_on": "2026-09-13", "summary_ko": "2018~2025년 사이 Web of Science와 PubMed에서 발표된 소동물 흉부 방사선촬영 분야 AI 관련 연구 27편을 수집하여 Biblioshiny를 이용한 bibliometric analysis를 수행했다. 출판 편수는 연간 성장률 10.41%로 증가 추세를 보였고 2023년에 8편으로 정점을 찍었으며, 2020년 발표 논문들이 평균 46.33회 인용으로 가장 높은 인용 영향력을 보였다. T. Banzato가 가장 다작한 저자였고 미국(32건)과 이탈리아(23건)가 주요 기여국이었으며, 주제 분석 결과 개의 cardiomegaly, pleural effusion, pulmonary disease에 대한 CNN(convolutional neural network)·deep learning 기반 자동 탐지가 초기 연구의 주된 초점이었다. 데이터셋의 이질성과 종 다양성 부족이 여전히 표준화의 걸림돌로 지적되었다.", "summary_en": "This bibliometric analysis reviewed 27 articles (2018-2025) on AI applications in small animal thoracic radiography from Web of Science and PubMed, analyzed with Biblioshiny. Publications grew at an annual rate of 10.41%, peaking at 8 articles in 2023, with 2020 publications showing the highest citation impact (mean 46.33 citations). T. Banzato was the most prolific author, and the United States and Italy were the leading contributing countries. Thematic analysis showed a primary focus on CNN- and deep-learning-based detection of cardiomegaly, pleural effusion, and pulmonary disease in dogs, with dataset heterogeneity and species diversity remaining key limitations to standardization.", "clinical_takeaway_ko": "흉부 방사선촬영 AI 보조진단 도구를 진료에 도입할 때는 아직 학습 데이터셋의 종·품종 다양성이 제한적이라는 점을 인지하고, 자신이 진료하는 환자군과 유사한 조건에서 검증된 도구인지 확인한 뒤 사용해야 한다."}, {"pmid": "42531994", "title": "Diagnostic imaging findings in animal abuse cases referred to the University of Veterinary Medicine Vienna, Austria (2014-2023).", "journal": "Forensic Science International", "year": "2026", "authors": ["Klaudia Pietras", "Yasamin Vali"], "url": "https://pubmed.ncbi.nlm.nih.gov/42531994/", "doi": "10.1016/j.forsciint.2026.113076", "study_type": "후향적 연구", "sample_size": "83", "evidence_basis": "abstract", "species": ["dog", "cat", "rabbit"], "modality": ["radiography", "CT"], "system": ["trauma"], "topics": ["trauma-forensic-imaging"], "tags": ["dog", "cat", "rabbit", "radiography", "CT", "trauma"], "added_on": "2026-09-13", "summary_ko": "비엔나 수의과대학에서 2014~2023년 사이 개, 고양이, 조류, 토끼목, 파충류를 포함한 반려동물·특수동물 11,689건의 영상진단 기록을 후향적으로 검토하여 동물 학대(animal abuse)가 의심되는 83건을 선별했다. 전 종에 걸쳐 fracture와 ballistic trauma(총상)가 가장 흔한 손상 소견이었으며, 진단에는 radiography와 CT가 주로 사용되었고 ultrasound와 MRI는 사례 확정에 전혀 활용되지 않았다. 조류와 파충류처럼 해부학적 구조가 복잡한 종에서는 CT가 특히 유용했고, radiography는 전 종에서 효과적이었다. 저자들은 영상진단이 학대 사례에서 객관적이고 사례별 근거를 제공하여 임상적 평가와 forensic investigation, 법적 절차를 뒷받침한다고 결론지었다.", "summary_en": "This retrospective study reviewed imaging records from 11,689 companion and exotic animals at the University of Veterinary Medicine Vienna (2014-2023) and identified 83 cases of suspected animal abuse. Skeletal fractures and ballistic trauma were the most common findings across dogs, cats, birds, lagomorphs, and reptiles, with radiography and CT as the primary modalities used; ultrasound and MRI were not used for case qualification. CT was particularly valuable in birds and reptiles due to their anatomical complexity, while radiography was effective across all species. The findings support diagnostic imaging as objective evidence for forensic veterinary investigations and legal proceedings.", "clinical_takeaway_ko": "동물 학대가 의심되는 환자에서는 radiography를 1차 선별검사로 활용하고, 조류·파충류처럼 해부학적으로 복잡한 종에서는 CT를 추가로 시행하면 은폐된 fracture나 ballistic trauma 소견을 놓치지 않고 법적 증거로 활용 가능한 영상 기록을 남길 수 있다."}, {"pmid": "42522404", "title": "Patient Dimensions From a Single CT Image Provide a Clinically Practical and Accurate Method for Dose Estimation in Canine Abdominal CT Imaging.", "journal": "Veterinary Radiology & Ultrasound", "year": "2026", "authors": ["Claire Whittaker", "Monique Mayer", "Matthew Hutcheson", "Sally Sukut"], "url": "https://pubmed.ncbi.nlm.nih.gov/42522404/", "doi": "10.1148/radiol.2021211241", "study_type": "후향적 연구", "sample_size": "30", "evidence_basis": "abstract", "species": ["dog"], "modality": ["CT"], "system": ["abdomen", "technique"], "topics": ["imaging-technique-safety"], "tags": ["dog", "CT", "abdomen", "technique"], "added_on": "2026-09-13", "summary_ko": "이 후향적 연구는 체중 3구간(<10 kg, 10-30 kg, >30 kg)으로 나눈 개 30마리의 abdominal CT를 대상으로, 단일 CT 영상에서 얻은 환자의 선형 치수(dorsoventral, lateral 치수)로 산출한 AAPM geometric size metrics가 water-equivalent diameter(Dw) 기반의 size-specific dose estimate(SSDE)와 얼마나 일치하는지 평가했다. dorsoventral(DV)과 lateral(LAT) 치수를 합산한 지표가 Dw와 가장 강한 상관관계를 보였고(R²=0.94, p<0.001), 스캐너가 표시하는 CTDIvol은 실제 SSDE를 약 50% 과소평가했다. pre-contrast 단일기(single-phase) abdominal CT의 SSDE 75th percentile은 21 mGy로, 사람 기준의 US dose reference level보다 2~4배 높았다. 저자들은 단일 영상에서 얻은 기하학적 크기 지표만으로도 개 abdominal CT의 SSDE를 실용적이고 정확하게 추정할 수 있으며, 기관별 SSDE 값에 대한 선량 최적화 검토가 필요할 수 있다고 결론지었다.", "summary_en": "This retrospective observational study evaluated whether AAPM geometric size metrics for abdominal CT, calculated from linear dimensions on a single CT image, correlate with water-equivalent diameter (Dw)-based size-specific dose estimate (SSDE) in 30 dogs across three body weight categories (<10, 10-30, and >30 kg). The combined dorsoventral (DV) and lateral (LAT) dimension metric showed the strongest correlation with Dw (R² = 0.94, p < 0.001), and the scanner-displayed CTDIvol underestimated SSDE by about 50%. The 75th percentile SSDE for a single-phase, pre-contrast abdominal scan was 21 mGy, two to four times higher than the human US dose reference level. The findings support single-image geometric size metrics as a practical and accurate method for SSDE estimation in canine abdominal CT, and suggest institutional SSDE values may warrant dose optimization review.", "clinical_takeaway_ko": "abdominal CT 시행 시 단일 영상에서 측정한 DV+LAT 치수만으로도 SSDE를 실용적으로 추정할 수 있으며, 스캐너에 표시되는 CTDIvol만으로는 실제 선량을 약 50% 과소평가할 수 있으므로 환자 크기 보정 없이 프로토콜을 판단하면 피폭 관리에서 놓치는 부분이 생길 수 있다."}, {"pmid": "42150942", "title": "Artificial Intelligence-Assisted Interpretation of Veterinary Radiographs: Opportunities, Risks, and Best Practices for Clinicians.", "journal": "The Veterinary Clinics of North America: Small Animal Practice", "year": "2026", "authors": ["Parminder S Basran", "Ryan Appleby", "Ian Porter"], "url": "https://pubmed.ncbi.nlm.nih.gov/42150942/", "doi": "10.1016/j.cvsm.2026.03.018", "study_type": "종설", "sample_size": "", "evidence_basis": "abstract", "species": [], "modality": ["radiography"], "system": ["AI"], "topics": ["ai-imaging"], "tags": ["radiography", "AI"], "added_on": "2026-09-13", "summary_ko": "이 종설은 수의 방사선 영상 판독에서 AI의 역할을 임상의 관점에서 다루며, AI는 clinical judgment를 대체하는 것이 아니라 의사결정을 보조하는 decision support tool로 자리매김해야 한다고 강조한다. AI 활용 여부와 무관하게 모든 진단과 치료 결정에 대한 전문적 책임은 수의사에게 있으며, AI 시스템이 어떻게 작동하고 어떤 한계가 있는지를 보호자가 이해할 수 있는 언어로 설명할 수 없다면 임상에서 사용해서는 안 된다고 주장한다. 성공적인 도입을 위해서는 팀 전체 교육, 전통적 판독 능력 유지, quality assurance 체계 구축과 같은 확립된 best practices를 따라야 한다고 제안한다.", "summary_en": "This review discusses the role of AI in interpreting veterinary radiographs from a clinician's perspective, emphasizing that AI functions as a decision-support tool rather than a replacement for clinical judgment. Veterinarians retain full professional accountability for all diagnoses and treatment decisions regardless of AI involvement, and AI should not be used clinically if its function and limitations cannot be explained to clients in understandable terms. Successful implementation requires best practices including comprehensive team training, maintenance of traditional diagnostic skills, and quality assurance protocols.", "clinical_takeaway_ko": "AI 판독 보조 도구를 도입하더라도 최종 진단과 치료의 책임은 항상 수의사에게 있으므로, 보호자에게 AI의 작동 방식과 한계를 명확히 설명할 수 있어야 하고 전통적인 판독 능력을 유지하면서 quality assurance 절차를 함께 마련해야 한다."}];
  let allTopics = [{"slug": "musculoskeletal-imaging", "title": "근골격 영상", "synthesis": "### 관절 초음파 vs 방사선검사\nLeishmania infantum 감염견 43마리를 대상으로 한 전향적 연구에서 관절 초음파(USG)는 tarsal joint 병변을 86%(37/43)에서 검출해 방사선검사 40%(8/20)보다 뚜렷하게 우수했고, 신체검사 대비 민감도도 USG 89.7% vs 방사선검사 46.7%로 USG가 우월했다 ([[papers/2026-42763011-us-vs-radiography-leishmaniasis-joints|Oliveira 2026]]; 전향적 연구, n=43). USG로 병변이 확인된 개의 29.7%는 임상적으로 무증상이어서, USG가 subclinical arthropathy 검출에도 유용함을 시사한다. CrCL 자체의 초음파 평가에서는 3D 초음파(3D-US)가 사체 stifle 34개에서 femoral·tibial attachment와 인대 본체를 모두 식별해 feasibility를 보였으나 ([[papers/2026-42754086-3d-ultrasonography-cranial-cruciate-ligament|Barbero-Fernández 2026]]; 실험 연구, n=17/34 stifle), 정상 인대만을 대상으로 한 사체 연구이므로 rupture 진단 성능은 아직 검증되지 않았다 — 제한적 근거.\n\n### TPLO 술후 방사선 평가\nTPLO 관련 방사선 근거가 여러 편 쌓였다. Popliteus muscle을 보존하는 변형 TPLO는 전통적 술식 대비 45일차 방사선 골유합 점수가 유의하게 높았으나(10점 척도 기준 보정 평균차 1.95점) osteotomy 안정성(rock-back)에는 차이가 없었고, 저자들도 이 방사선학적 차이가 실제 임상 회복으로 이어지는지는 알 수 없다고 명시했다 ([[papers/2026-42760893-tplo-popliteus-sparing-radiographic-healing|Sassaroli 2026]]; 무작위대조군연구, n=100). 반면 8주차 정기 TPLO 방사선평가는 신체검사 권고안을 대부분(59.5%) 바꾸지 않았고, 평가자 간 일치도도 낮아(κ=0.20 전후) 정기 방사선검사의 실질적 이득에 의문을 제기했다 ([[papers/2026-42762824-8-week-tplo-radiographs-management-plan|Hancock 2026]]; 전향적 연구, n=97/291건 평가). TPLO 대상견에서 고관절 방사선을 함께 평가한 후향적 연구는 canine hip dysplasia(CHD)의 방사선학적 유병률이 36.3%이며, CHD가 심할수록 osteoarthritis도 심하고(OR 22.91/단계) 반대쪽 stifle에서 CCLD가 발생할 위험도 높아진다는 것을 보여주었다(OR 3.70/단계) ([[papers/2026-42744301-hip-dysplasia-prevalence-ccld-tplo|Courzereaux 2026]]; 후향적 연구, n=466).\n\n### Hip dysplasia 등급 판정 기준의 변화\nFCI 2022년 개정 판정법(FCI22)을 기존 2006년 방법(FCI06)과 비교한 후향적 연구에서, 전체 고관절의 68.3%는 등급이 유지되었지만 Boxer에서는 29.4%가 하향, Australian Shepherd에서는 17.2%가 상향 조정되는 등 품종별로 재분류 패턴이 크게 달랐고, 재분류는 주로 기존 D등급 고관절에서 발생했다(82.4%) ([[papers/2026-42735705-fci-2022-vs-2006-hip-dysplasia-grading|Gras 2026]]; 후향적 연구, n=1318).\n\n### 골절·골 병변의 방사선 소견\nPatella fracture and dental anomaly syndrome(PADS) 고양이 126마리의 후향적 증례군 연구에서는 patellar fracture 외에도 22.2%가 근위 tibia·fibula·pelvis 등 추가 골절을 동반했고, 일부에서 초기 stress fracture나 osteopetrosis에 합당한 골 opacity 변화가 확인되었다 ([[papers/2026-42751918-radiographic-pads-cats-femora-tibiae|Boulton 2026]]; 후향적 연구, n=126). 단일 증례보고에서는 강아지의 급성 비체중부하 파행이 짧은 시간 내(15시간) septic physitis에서 병적 Salter-Harris type I 골절로 진행한 사례가 처음 보고되어, physis widening 소견 시 단기 재촬영의 필요성을 시사했다 ([[papers/2026-42718565-septic-physitis-physeal-fracture-puppy|Sidhu 2026]]; 증례보고, n=1) — 제한적 근거.\n\n### CT 기반 정량 분석과 촬영 기법\nOsteosarcoma가 있는 개 16마리의 CT 영상에서 재구성한 뼈 모델로 FEA 시뮬레이션과 머신러닝 대리모델을 결합해 골절 하중을 예측한 연구는 held-out 165건에서 평균 R²≈0.90의 예측 성능을 보였으나, proof-of-concept 단계이며 실제 임상 검증은 이루어지지 않았다 ([[papers/2026-42705596-ml-fracture-load-prediction-osteosarcoma-ct|Amirzade 2026]]; 실험 연구, n=16) — 제한적 근거. Elbow CT 촬영 자세 비교 실험에서는 lateral recumbency로 elbow를 개별 촬영하는 것이 dorsal recumbency 동시 촬영보다 signal/contrast-to-noise ratio가 유의하게 우수했고, tube current를 150mA에서 300mA로 올려도 이 차이를 보완하지 못했다 ([[papers/2026-42761083-recumbency-tube-current-canine-elbow-ct|Bellekom 2026]]; 실험 연구, n=20/40 elbow).\n\n### 고관절 치환술 후 영상 추적\nSlipped capital femoral epiphysis(SCFE)·hip dysplasia 등으로 cementless Zurich Mini total hip replacement(THR)를 받은 고양이 11마리(17 hips)의 후향적 연구에서, intraoperative fluoroscopy로 cup 위치를 최적화했고 8주째 남은 임플란트는 모두 방사선상 완전~진행성 osteointegration을 보였다 ([[papers/2026-42767266-zurich-mini-thr-cats|Vedrine 2026]]; 후향적 연구, n=11/17 hips). 다만 femoral fracture가 11.8%에서 발생(1례 절단)해, 술후 방사선 추적 시 이 합병증에 대한 주의가 필요함을 시사했다.", "related_papers": ["leishmaniasis 관절병변 검출에서 초음파가 방사선보다 우수 (전향적 연구, n=43)", "popliteus-sparing TPLO가 45일차 방사선 골유합 점수 개선 (무작위대조군연구, n=100)", "8주차 TPLO 방사선이 관리계획 변경으로 이어지는 경우는 드묾 (전향적 연구, n=97/291건)", "3D 초음파로 CrCL 시각화 feasibility 확인 (실험 연구, n=17/34 stifle)", "PADS 고양이의 femur·tibia 추가 골절·골 opacity 변화 서술 (후향적 연구, n=126)", "TPLO 대상견의 CHD 유병률 36.3%, 반대쪽 CCLD 위험과 연관 (후향적 연구, n=466)", "FCI22 판정법 도입 시 품종별 등급 재분류 패턴 상이 (후향적 연구, n=1318)", "CT-FEA-ML로 osteosarcoma 골절 하중 예측 (실험 연구, n=16)", "lateral recumbency가 elbow CT 영상 품질에서 우수 (실험 연구, n=20/40 elbow)", "septic physitis에 의한 강아지 physeal fracture 첫 보고 (증례보고, n=1)", "고양이 cementless THR 후 8주째 방사선상 osteointegration 양호, femoral fracture 11.8% (후향적 연구, n=11/17 hips)"], "paper_count": 11, "conflicting_evidence": "(아직 없음)", "open_questions": "- 3D 초음파의 CrCL rupture 실제 진단 성능(민감도·특이도)은 생체 개 대상 연구로 검증되어야 한다.\n- TPLO 술후 방사선 골유합 점수 차이(popliteus-sparing 등)가 실제 임상 기능 회복과 상관관계가 있는지는 아직 불명확하다.\n- 정기 TPLO 술후 방사선검사가 관리계획을 바꾸는 빈도가 낮다는 결과를 바탕으로, 어떤 임상·영상 소견 조합에서 방사선검사가 실제로 유용한지 규명할 전향적 연구가 필요하다.\n- CT-FEA-ML 기반 골절 하중 예측 모델의 임상 검증(전향적 코호트, 다기관)은 아직 이루어지지 않았다."}, {"slug": "abdominal-imaging", "title": "복부·소화기 영상", "synthesis": "### 간담도 영상\nBenign gallbladder disease로 open cholecystectomy를 받은 개 73마리의 후향적 연구에서, bile duct flushing 후 시행한 intraoperative cholangiography(IOC)는 complete common bile duct(CBD) obstruction을 12.5%, retained debris로 인한 partial obstruction을 20.8%, hepatic duct filling defect를 10.6%에서 추가로 검출했다 ([[papers/2026-42717636-intraoperative-cholangiography-cholecystectomy|Konno 2026]]; 후향적 연구, n=73). 주술기 사망률은 황달이 있던 개(11.4%)에서 없던 개(0%)보다 뚜렷이 높아, 담도 폐쇄가 진행된 증례에서 IOC 같은 보조 영상 검사의 필요성을 시사한다. 간 종양 영상에서는 massive형 hepatocellular carcinoma(HCC) 20예의 CT perfusion(CTP) 분석에서 종양이 정상 간보다 portal venous flow는 낮고 hepatic perfusion index는 높은, 즉 상대적 동맥 우세 양상을 보였다(p<0.001) ([[papers/2026-42710534-ct-perfusion-hepatocellular-carcinoma|Wang 2026]]; 후향적 연구, n=20). 다만 저자들은 CTP가 형태학적 영상·병리·예후 평가를 대체할 수 없다고 명시했다. 자궁축농증(CEH-P complex) 개 34마리를 대상으로 한 2D shear wave elastography 연구는 병변 간 자체의 탄성도 상승과 ALT/ALP 비율 상승이 CEH-P에 의한 간손상 검출에 민감했음을 보여주어, 자궁 질환이 간에 미치는 전신적 영향을 초음파로 정량 평가할 수 있는 가능성을 제시했다 ([[papers/2026-42759150-2d-swe-elastography-pyometra-uterus-liver|Mahzunlar 2026]]; 전향적 연구, n=49 — 자궁 소견은 [[topics/urogenital-imaging]] 참고).\n\n### 위장관 영상\n개 장관 신생물의 MRI 소견을 다룬 최초의 수의영상의학 증례군 연구(lymphoma 6, adenocarcinoma 2, inflammatory polyp 4)에서, intestinal lymphoma는 contrast-enhanced T1WI에서 전례 균질한 hypointense 조영증강을 보였고(p=0.002) ADC 값도 다른 신생물보다 유의하게 낮아(0.58×10⁻³mm²/s 대 1.27~1.56×10⁻³mm²/s) MRI 기반 감별 가능성을 시사했다 ([[papers/2026-42751982-mri-differential-diagnosis-intestinal-neoplasms|Tanaka 2026]]; 증례군, n=12) — 각 군 표본이 매우 작아 제한적 근거.\n\n### 정상 해부 참고자료\n성체 고양이 10마리를 이용해 흉복부 단면 해부와 조영증강 CT·3D 재구성을 상호 대조한 atlas 연구는 고양이 흉복부 CT 판독과 수술 계획을 위한 정상 해부 참고자료를 제공했으며, 조영증강이 혈관·장기 관계의 시인성을 크게 향상시켰다 ([[papers/2026-42710191-ct-atlas-feline-thorax-abdomen|Abdelmohsen 2026]]; 실험 연구, n=10 — [[topics/thoracic-imaging]]에도 해당).", "related_papers": ["IOC가 담도 잔류 debris·폐쇄를 상당 빈도로 추가 검출 (후향적 연구, n=73)", "개 HCC에서 CT perfusion상 상대적 동맥 우세 확인 (후향적 연구, n=20)", "CEH-P에서 간 탄성도·ALT/ALP 비율로 간손상 평가 (전향적 연구, n=49)", "장관 lymphoma의 MRI 조영증강·ADC 감별 소견 (증례군, n=12)", "고양이 흉복부 CT-해부 대조 atlas (실험 연구, n=10)"], "paper_count": 5, "conflicting_evidence": "(아직 없음)", "open_questions": "- CT perfusion으로 확인된 HCC의 관류 패턴이 분화도·절제가능성·예후 예측에 실제로 기여하는지는 poorly differentiated 종양 표본(3예)이 너무 작아 결론 내리기 어렵다.\n- IOC가 실제로 수술 후 합병증·사망률을 낮추는지(단순히 기저 질환 중증도를 반영하는 것이 아니라)는 대조군 비교 연구가 필요하다.\n- 장관 lymphoma의 MRI 감별 소견(hypointense 조영증강, 낮은 ADC)이 더 큰 코호트에서도 재현되는지 검증이 필요하다."}, {"slug": "imaging-technique-safety", "title": "촬영 기법·안전", "synthesis": "### CT 방사선 선량 추정\nCT 검사의 방사선 피폭을 환자별로 정확히 파악하기 위해 크기별 선량 추정치(size-specific dose estimate, SSDE)를 사용하는 방법이 대두되고 있다. 개 abdominal CT를 대상으로 한 단일기관 후향적 연구(30마리, 체중 3구간)에서는, 여러 단면에 걸친 복잡한 측정 대신 단일 CT 영상에서 얻은 dorsoventral(DV)·lateral(LAT) 선형 치수의 합만으로도 water-equivalent diameter(Dw) 기반 SSDE와 강한 상관관계(R²=0.94, p<0.001)를 보여, 임상적으로 실행 가능하고 정확하게 SSDE를 산출할 수 있음을 확인했다 ([[papers/2026-42522404-ssde-canine-abdominal-ct|Whittaker 2026]]; 후향적 연구, n=30). 같은 연구에서 스캐너가 표시하는 CTDIvol은 실제 SSDE를 약 50% 과소평가했고, pre-contrast 단일기 abdominal CT의 SSDE 75th percentile(21 mGy)은 사람의 US dose reference level보다 2~4배 높았다 ([[papers/2026-42522404-ssde-canine-abdominal-ct|Whittaker 2026]]; 후향적 연구, n=30). 이는 스캐너 표시값에만 의존하면 실제 환자 피폭을 과소평가할 수 있으며, 별도 소프트웨어나 다중 측정 없이도 개별 환자의 방사선 피폭 관리에 활용할 수 있는 실용적 방법이 있음을 시사한다. 다만 단일기관·단일 스캐너 자료이고 pre-contrast abdominal CT에 국한된 결과라, 다른 프로토콜·부위·장비로의 일반화는 확인되지 않은 제한적 근거다.\n\n### 환자 체위와 영상 품질\n개 사체 20구(elbow 40개)를 이용한 실험 연구에서 elbow CT를 lateral recumbency로 개별 촬영하는 것이 dorsal recumbency로 양측을 동시 촬영하는 것보다 signal-to-noise ratio·contrast-to-noise ratio(bone·soft-tissue kernel 모두)에서 유의하게 우수했고(p<0.001), 150mA lateral recumbency가 300mA dorsal recumbency보다도 우수했다 ([[papers/2026-42761083-recumbency-tube-current-canine-elbow-ct|Bellekom 2026]]; 실험 연구, n=20/40 elbow — 근골격 소견은 [[topics/musculoskeletal-imaging]] 참고). Tube current를 150mA에서 300mA로 올려도 동일 자세 내에서는 유의한 개선이 없어, tube current 증가가 자세 최적화를 대체하지 못함을 시사했다. 판독자들은 artifact·연부조직 대비 평가에서 lateral recumbency를 99~100% 선호했다.\n\n체위가 영상 품질에 미치는 영향은 흉부 CT에서도 확인된다. 건강한 Beagle 8마리를 대상으로 한 crossover 연구는 진정 하 thoracic CT 전 동맥혈 채혈 시 femoral artery 채혈(lateral recumbency 필요)이 dorsal pedal artery 채혈(sternal recumbency)보다 시간이 더 걸릴 뿐 아니라, 짧은 lateral recumbency만으로도 cranial·middle·caudal lung lobe 전반에서 CT상 atelectasis와 연관됨을 보여주었다 ([[papers/2026-42750099-arterial-sampling-atelectasis-ct|Sakai 2026]]; 실험 연구, n=8). 즉 CT 직전 처치 시의 체위·자세도 영상 품질(폐야 판독)에 영향을 줄 수 있다는 점에서 elbow CT 체위 연구와 같은 맥락의 근거다.\n\n### 조영제 이상반응\n비이온성 요오드화 조영제에 의한 중증 과민반응은 드물지만, 전이 평가를 위해 조영 CT를 시행한 개 증례에서 조영 후 2분·4분 지연영상에 hepatic congestion 의심, 혈관 허탈, esophageal wall edema, 장점막 과다조영증강, 심장 챔버·신실질 내 조영제 정체, renal excretory phase 소실이 순차적으로 나타난 뒤 마취 회복 중 중증 저혈압·호흡부전으로 진행했다 ([[papers/2026-42738496-ct-contrast-hypersensitivity-dog|Chung 2026]]; 증례보고, n=1). 저자들은 이러한 순차적 CT 소견이 임상 증상이 뚜렷해지기 전 조영제 유발 과민반응·shock의 조기 영상 지표가 될 수 있다고 제안했으나, 단일 증례이므로 예측 민감도·특이도는 알 수 없다 — 제한적 근거.\n\n### 조영 CT 술기 교육·시뮬레이션\nCTA(CT angiography)의 bolus tracking은 학습 곡선이 가파르고 시간 창이 좁아 초심자가 익히기 어려운데, 생리적 조영제 동태를 재현하는 peristaltic pump 폐회로에 결합한 3D 프린팅 개 hepatic artery 팬텀으로 훈련한 참여자 18명(경력별 층화) 연구에서는 중급·초심자군의 총 조작 시간이 유의하게 단축되고 전 군에서 ROI 배치 시간이 개선되었다 ([[papers/2026-42765932-3d-printed-phantom-ct-bolus-tracking-training|Min 2026]]; 실험 연구, n=18). 동물 사용을 대체할 수 있는 윤리적 훈련 대안으로, 실제 환자 CTA 성공률로의 전이 효과는 이 연구만으로는 확인되지 않았다.", "related_papers": ["조영 CT 후 순차적 지연영상에서 중증 과민반응 진행 과정 서술 (증례보고, n=1)", "단일 CT 영상의 DV+LAT 치수만으로 개 abdominal CT의 SSDE를 실용적이고 정확하게 추정 (후향적 연구, n=30)", "lateral recumbency가 elbow CT 영상 품질에서 dorsal recumbency·tube current 증가보다 우수 (실험 연구, n=20/40 elbow)", "thoracic CT 전 lateral recumbency 채혈이 CT상 atelectasis와 연관 (실험 연구, n=8)", "3D 프린팅 hepatic artery 팬텀으로 CT bolus tracking 훈련, 중급·초심자군 조작시간 단축 (실험 연구, n=18)"], "paper_count": 5, "conflicting_evidence": "", "open_questions": "- 조영 CT 중 관찰된 순차적 CT 소견(esophageal wall edema, 장점막 과다조영증강, renal excretory phase 소실 등)이 실제로 조영제 과민반응을 예측하는 민감도·특이도는 단일 증례로는 알 수 없다.\n- DV+LAT 기반 SSDE 추정법이 흉부 CT, 다중기 조영 프로토콜, 다른 제조사 스캐너에도 동일하게 성립하는지 확인이 필요하다.\n- 국내·원내 CTDIvol 표시값과 실제 SSDE 간 괴리 정도를 자체 프로토콜에서 검증한 자료는 아직 없다.\n- Elbow CT 체위 비교 결과가 medial coronoid process 병변 자체의 진단 정확도(민감도·특이도) 차이로 이어지는지는 사체 연구만으로는 알 수 없다.\n- 짧은 lateral recumbency로 인한 atelectasis가 실제 폐 병변 판독의 민감도·특이도에 어느 정도 영향을 미치는지는 건강한 실험견 8마리 연구만으로는 알 수 없다.\n- 3D 프린팅 팬텀 훈련으로 얻은 술기 향상이 실제 환자 CTA의 bolus tracking 성공률·진단 품질 향상으로 이어지는지는 검증되지 않았다."}, {"slug": "ai-imaging", "title": "AI·정량 영상", "synthesis": "수의영상의학 분야에서 AI, 특히 딥러닝 기반 자동 판독 기술에 대한 관심과 연구가 빠르게 증가하고 있다. 2018-2025년 소동물 흉부 radiography 관련 AI 문헌 27편을 분석한 서지계량 연구에 따르면, 연구 출판은 연평균 10.41%씩 증가해 2023년 정점(8편)을 찍었고, 미국과 이탈리아가 주요 연구 생산국이었으며, 개의 cardiomegaly·pleural effusion·pulmonary disease에 대한 CNN(convolutional neural network)·deep learning 기반 자동 탐지가 초기 연구의 핵심 주제였다 ([[papers/2026-42593822-ai-bibliometric-thoracic-radiography|Canatan 2026]]; 기타/서지계량분석, n=27편). 다만 데이터셋의 이질성과 대상 종·품종의 다양성 부족이 표준화의 걸림돌로 지목되었다([[papers/2026-42593822-ai-bibliometric-thoracic-radiography|Canatan 2026]]; 기타/서지계량분석, n=27편). 이 분석은 개별 AI 알고리즘의 진단 정확도가 아니라 문헌 동향 자체를 다룬 것이라는 점에 유의해야 한다.\n\n임상 적용 측면에서는, AI는 어디까지나 clinical judgment를 보조하는 decision support tool로 자리매김해야 하며 최종 진단과 치료 결정에 대한 책임은 여전히 수의사에게 있다는 점이 강조된다 ([[papers/2026-42150942-ai-assisted-radiograph-interpretation|Basran 2026]]; 종설). 보호자에게 AI의 작동 방식과 한계를 이해하기 쉽게 설명할 수 없다면 임상에 도입해서는 안 되며, 성공적인 도입을 위해서는 팀 교육, 전통적 판독 능력 유지, quality assurance 체계가 필요하다([[papers/2026-42150942-ai-assisted-radiograph-interpretation|Basran 2026]]; 종설). 이 권고는 정량적 검증 연구가 아니라 임상의 관점의 종설에 기반한 것으로, 원저 수준의 근거는 아니다.\n\n### 영상 기반 정량 예측 모델\n판독 보조를 넘어, 영상에서 추출한 정량 데이터를 머신러닝으로 예측에 활용하는 연구도 등장하고 있다. Appendicular osteosarcoma를 가진 개 16마리의 CT 영상에서 재구성한 뼈 모델로 FEA(Finite Element Analysis)·XFEM 시뮬레이션을 수행하고, 이 시뮬레이션 데이터(825건)로 여러 머신러닝 모델(MLP, SVR, RF, XGBoost, HistGBR)을 학습시켜 골절 하중을 예측한 연구에서는 XGBoost가 held-out 165건에서 평균 R²≈0.90, 정규화 평균절대오차 약 8%의 성능을 보였다 ([[papers/2026-42705596-ml-fracture-load-prediction-osteosarcoma-ct|Amirzade 2026]]; 실험 연구, n=16). 병변 부담(lesion burden)과 체중이 가장 중요한 예측 인자였으나, 저자들 스스로 이것이 proof-of-concept 단계이며 실제 임상 결과(치료된 개 6마리)는 서술적 참고일 뿐 공식 검증이 아니라고 명시했다 — 제한적 근거. 같은 맥락에서 canine glioma의 T2-FLAIR MRI radiomics(texture, shape, intensity) 특징을 human glioblastoma와 비교한 연구는 선별된 radiomic feature가 종양·비병변 조직을 AUC 80% 이상으로 구별했고, 개·사람 통합 SVM 모델이 80.33%의 정확도를 보여 translational 모델로서의 가치를 시사했다 ([[papers/2026-42746025-radiomics-canine-glioma-mri|Faustino 2026]]; 후향적 연구, n=\"\" — 상세는 [[topics/neuro-imaging]] 참고). 다만 이 연구도 canine 단독 증례 수·진단 성능이 별도로 제시되지 않아 임상 진단 도구로 쓰기는 이르다.", "related_papers": ["2018-2025년 소동물 흉부 radiography AI 문헌 27편 서지계량 분석, CNN 기반 자동탐지가 주요 초점 (기타/서지계량분석, n=27편)", "AI는 의사결정 보조도구이며 최종 책임은 수의사에게 있다는 임상 관점의 모범사례 (종설)", "CT-FEA-ML로 osteosarcoma 골절 하중 예측, proof-of-concept (실험 연구, n=16)", "T2-FLAIR radiomics로 canine glioma·human glioblastoma 종양 조직 판별 (후향적 연구, n=\"\")"], "paper_count": 4, "conflicting_evidence": "", "open_questions": "- 실제 임상에서 사용 가능한 개별 AI 판독 도구의 민감도·특이도를 종·품종별로 검증한 원저 연구는 이 위키에 아직 없다.\n- AI 보조진단 도구의 quality assurance 체계를 실제 2차 동물병원 워크플로우에 어떻게 통합할지에 대한 구체적 지침은 부족하다.\n- CT-FEA-ML 기반 골절 하중 예측, radiomics 기반 종양 판별 모두 proof-of-concept 단계로, 전향적·다기관 임상 검증이 아직 없다."}, {"slug": "cardiac-imaging", "title": "심장·대혈관 영상", "synthesis": "### 성장기 소형견의 심초음파 참고치\n소형 순종·잡종 강아지 13마리를 생후 2개월부터 18개월까지 추적한 전향적 종단 연구에서, 체중은 거의 모든 심초음파 형태 변수에 영향을 미쳤으나 기능 변수 중에는 stroke volume만 영향을 받았고 품종 효과는 없었다 ([[papers/2026-42735743-echocardiography-reference-intervals-growing-dogs|Huk 2026]]; 전향적 연구, n=13). 기존에 대형·중형견 자료로 만들어진 allometric scaling 상수는 이 소형 성장기 집단의 심초음파 변수를 정확히 예측하지 못해, 저자들은 소형 성장기 강아지 전용 allometric equation을 새로 제시했다. 표본 크기가 작은 단일 코호트 연구로 — 제한적 근거.\n\n### Myxomatous mitral valve disease(MMVD)의 정량·형태학적 평가\n개 MMVD에서 mitral regurgitation(MR) 중증도를 체중 대비 regurgitant volume(RVol/kg)으로 정량화하기는 어려운데, 사람 심장학에서 제안된 mitral-to-aortic velocity time integral(VTI) ratio(mitral inflow VTI ÷ left ventricular outflow tract VTI)를 MMVD 개 167마리·대조군 21마리에 적용하자 이 비율은 ACVIM stage 진행에 따라 증가하고(P<0.001) RVol/kg·regurgitant fraction(RF)과 강한 상관관계(r=0.75 각각)와 높은 재현성(ICC>0.90)을 보였으며, RF≥50%(중증 MR) 식별에서 ROC AUC 0.89로 가장 높은 정확도를 나타냈다 ([[papers/2026-42722611-mitral-aortic-vti-ratio-mmvd|Kawai 2026]]; 후향적 연구, n=188). 형태학적으로는 MMVD 개 1108마리의 후향적 심초음파 재검토에서 leaflet involvement(billow → prolapse → isolated flail/prolapse with flail)가 stage 진행과 체계적으로 연관되어, billow는 stage가 진행할수록 유의하게 감소하고(B1 79%→C/D 5%) prolapse with flail은 유의하게 증가했다(B1 5%→C/D 56%, 모두 P<0.001) ([[papers/2026-42760156-mitral-valve-morphology-mmvd|Bentley 2026]]; 후향적 연구, n=1108). 두 연구 모두 사람 심장학의 정량·형태학적 분류 체계를 개 MMVD 평가에 접목하려는 흐름을 보여준다.\n\n### 진정·마취가 심초음파 소견에 미치는 영향\n건강한 premedicated rabbit 22마리를 대상으로 propofol 단독 유도와 propofol+dextroketamine 유도의 심혈관·심초음파 효과를 비교한 무작위·맹검 연구에서, dextroketamine 병용 여부와 무관하게 fractional shortening·ejection fraction 등 전형적·longitudinal 수축기능 지표는 대체로 보존되었으나 propofol 단독군에서 평균동맥압 저하가 더 크게 나타났다(76→66mmHg vs 70→65mmHg, group×time p=0.049) ([[papers/2026-42710340-echocardiographic-effects-propofol-dextroketamine-rabbits|Fukuzaki 2026]]; 무작위대조군연구, n=22 — 진정·보정 측면은 [[topics/sedation-restraint-imaging]] 참고). 이는 마취 유도 프로토콜 선택이 심초음파로 측정하는 심기능·혈압 지표 해석에 영향을 줄 수 있음을 시사한다.", "related_papers": ["소형 성장기 강아지 전용 심초음파 allometric 참고치 제시 (전향적 연구, n=13)", "mitral-to-aortic VTI ratio가 MMVD 중증도·RF≥50% 식별에서 높은 정확도 (후향적 연구, n=188)", "MMVD stage에 따른 mitral valve leaflet 형태(billow/prolapse/flail) 변화 (후향적 연구, n=1108)", "propofol 단독 유도가 propofol+dextroketamine보다 토끼에서 평균동맥압 저하가 더 큼, 수축기능 지표는 보존 (무작위대조군연구, n=22)"], "paper_count": 4, "conflicting_evidence": "", "open_questions": "- 이 연구에서 도출된 소형견 전용 allometric 상수의 구체적 수치와 참고구간이 초록에 제시되지 않아, 원문 확인 없이는 임상 cut-off로 바로 사용하기 어렵다.\n- 중·대형 성장기 견종에 대해서도 유사한 품종별 재검증이 필요한지는 이 연구만으로는 알 수 없다.\n- Mitral-to-aortic VTI ratio의 구체적 cut-off 값과 stage C/D 개체에서의 성능은 표본이 적어 추가 검증이 필요하다.\n- Mitral valve leaflet 형태학적 분류(billow/prolapse/flail)가 실제 예후(생존, CHF 발생 시점)와 직접 연관되는지는 아직 검증되지 않았다.\n- 토끼 심초음파에서 propofol 단독 유도 시의 혈압 저하가 심질환이 있는 개체에서도 동일하게 나타나는지는 건강한 실험동물 연구만으로는 알 수 없다."}, {"slug": "neuro-imaging", "title": "뇌·두개내 영상", "synthesis": "### 저자장 MRI의 가능성\n사람 신경영상용으로 개발된 0.05T 휴대용 저자장(low-field) MRI 시스템이 개 사체 뇌 영상에서 1.5T 대비 T2-weighted 영상 기준 lateral ventricle·mesencephalic aqueduct 검출에 non-inferior한 성능(조건부 확률 90% 이상)을 보여, hydrocephalus 평가 보조 도구로서의 가능성이 제시되었다 ([[papers/2026-42730678-low-field-mri-canine-brain|Burgers 2026]]; 실험 연구, n=23). 다만 T1-weighted 영상에서는 non-inferiority가 불명확했고(조건부 확률 76.6%), 사체 연구 단계로 생체 내(in vivo) 검증은 아직 이루어지지 않았다 — 제한적 근거.\n\n### Ischemic cerebrovascular accident (ICVA)의 MRI 예후 인자\n개·고양이 63마리(개 47, 고양이 16)를 대상으로 한 후향적 연구에서, middle cerebral artery 영역 전체 또는 소뇌 반구 전체를 침범하는 \"complete territorial ICVA\" 아형이 12.7%에서 확인되었고, 여기에 중등도~중증 mass effect가 동반된 \"malignant ICVA\" 소견은 조기 사망과 강하게 연관되었다(OR 400) ([[papers/2026-42727605-mri-prognostic-features-ischemic-stroke|Desbordes 2026]]; 후향적 연구, n=63). Arterial spin labeling(ASL) perfusion에서 non-lacunar infarct는 모두 focal hypoperfusion을 보인 반면 lacunar infarct는 관류 이상이 없어 아형 감별에 도움이 되었지만, 발병 24시간 이내 영상에서 ischemic penumbra가 확인된 경우는 10.5%에 불과해 구제 가능 조직 판별 도구로서는 한계가 있었다.\n\n### 종양 영상: canine glioma의 translational 가치\nBrachycephalic 견종에 호발하는 canine glioma를 human glioblastoma의 translational model로 삼아 T2-FLAIR MRI radiomics(texture, shape, intensity)를 비교한 연구에서, 선별된 radiomic feature가 종양·비병변 조직을 AUC 80% 이상으로 구분했고 SVM 모델은 개·사람 통합 데이터셋에서 80.33% 정확도를 보였다 ([[papers/2026-42746025-radiomics-canine-glioma-mri|Faustino 2026]]; 후향적 연구, n=\"\"). 다만 이 연구는 canine 단독 증례 수가 명시되지 않았고 저자들도 표본 크기·집단 다양성의 한계를 인정한 translational 프레이밍의 연구로, 임상 진단 프로토콜로 바로 쓰기는 이르다 — 제한적 근거.\n\n### 기능적 MRI 기반 뇌전증 국소화 기법\n수의영상의학에서 epileptogenic zone(EZ)을 신뢰성 있게 국소화하는 방법은 아직 제한적이다. Amygdalo-hippocampal 침범이 시사된 familial spontaneous epilepsy 콜로니 고양이 10마리(scalp EEG상 interictal epileptiform discharge 확인, 3회씩 총 30세션)를 대상으로 한 탐색적 방법론 연구에서, EEG-functional MRI(EEG-fMRI)가 기술적으로 구현 가능함을 보였으나 BOLD 활성화는 다중비교 보정 후 유의하지 않았고, small-volume correction 분석에서도 30세션 중 16세션에서만 amygdalo-hippocampal 활성화가 확인되었다 ([[papers/2026-42765741-eeg-fmri-epilepsy-cats|Miura 2026]]; 실험 연구, n=10/30세션). 저자들도 개체 수준의 EZ 국소화는 아직 임상 적용에 부족하다고 명시했다 — 콜로니 사육 동물 대상의 pilot 연구로 제한적 근거.", "related_papers": ["0.05T 저자장 MRI, hydrocephalus 평가 가능성 (실험 연구, n=23)", "malignant ICVA(complete territorial + mass effect)가 조기 사망과 강하게 연관 (후향적 연구, n=63)", "T2-FLAIR radiomics로 canine glioma·human glioblastoma 종양 조직 판별 (후향적 연구, n=\"\")", "고양이에서 EEG-fMRI 기술적 실행 가능성 확인, 개체 수준 EZ 국소화는 아직 불충분 (실험 연구, n=10/30세션)"], "paper_count": 4, "conflicting_evidence": "(아직 없음)", "open_questions": "- 0.05T 저자장 MRI의 hydrocephalus 외 뇌 병변(종양, 염증, 외상 등) 검출 성능은 아직 평가되지 않았고, 생체 내(in vivo) 연구가 필요하다.\n- ICVA에서 ASL perfusion을 이용해 실제로 치료 가능한 penumbra를 임상적으로 구별해 낼 수 있는지는 표본이 작아 결론 내리기 어렵다.\n- Canine glioma radiomics가 실제 임상 진단·예후 예측에 사용될 수 있는 정량 기준(cut-off)은 아직 제시되지 않았다.\n- EEG-fMRI가 자연발생 뇌전증을 가진 임상 환자(수술 후보)에서도 개체 수준 EZ 국소화에 사용 가능한지는 콜로니 연구만으로는 알 수 없다."}, {"slug": "sedation-restraint-imaging", "title": "영상검사 진정·보정", "synthesis": "의식이 있는 상태에서 진정 없이 영상검사를 시행하는 보정 기법은 진정·마취에 따른 위험(사망률, 위장관 합병증 등)을 피하면서 영상 품질을 확보할 수 있는 방법으로 주목받고 있다.\n\n### 토끼 CT의 물리적 보정\n토끼를 대상으로 한 다기관 후향적 연구(93마리)에서는, 수건으로 감싸는 '번니 부리토(bunny burrito)' 보정법이 기존의 plexiglass chamber 보정법에 비해 pre-contrast 영상의 motion artifact가 적고(p=0.02), dental disease 평가 시 자세 유지가 우수하며(p=0.03), post-contrast 초기 안정성도 더 나은 것으로 나타났다(p=0.04, 신뢰구간 넓음) ([[papers/2026-42644764-bunny-burrito-restraint|Liu 2026]]; 후향적 연구, n=93). 번니 부리토와 sedation(10마리) 간 영상 품질은 기술통계상 유사한 수준이었고, 두 물리적 보정법 모두에서 합병증은 보고되지 않았다([[papers/2026-42644764-bunny-burrito-restraint|Liu 2026]]; 후향적 연구, n=93). 이는 토끼를 포함한 진정이 어려운 환자군에서 저비용·저위험 물리적 보정 기법이 실제 임상 영상 품질을 담보할 수 있음을 시사하나, 단일 연구·상대적으로 작은 sedation 대조군(n=10)에 기반한 제한적 근거다.\n\n### 마취 유도 프로토콜과 심초음파 측정치\n진정 하 영상검사에서 마취 유도제 선택은 심초음파로 측정하는 심기능 지표 해석에 영향을 줄 수 있다. 건강한 premedicated rabbit 22마리를 대상으로 propofol 단독 유도와 propofol+dextroketamine 유도를 비교한 무작위·맹검 연구에서, 수축기능 지표(fractional shortening, ejection fraction 등)는 두 군 모두 대체로 보존되었으나 propofol 단독군에서 평균동맥압 저하가 더 크게 나타났다(group×time p=0.049) ([[papers/2026-42710340-echocardiographic-effects-propofol-dextroketamine-rabbits|Fukuzaki 2026]]; 무작위대조군연구, n=22 — 심초음파 소견 상세는 [[topics/cardiac-imaging]] 참고). 건강한 개체 대상 연구이므로 심질환이 있거나 임상적으로 불안정한 환자에 그대로 적용하기는 어렵다.", "related_papers": ["토끼 CT에서 번니 부리토 보정법이 plexiglass chamber보다 motion artifact 적고 자세 안정성 우수 (후향적 연구, n=93)", "propofol 단독 유도가 propofol+dextroketamine보다 토끼에서 평균동맥압 저하가 더 큼 (무작위대조군연구, n=22)"], "paper_count": 2, "conflicting_evidence": "", "open_questions": "- 번니 부리토 보정법이 토끼 외의 소동물(고양이, 소형견 등)이나 다른 검사 부위(흉부, 두경부 등)에도 동일하게 적용 가능한지는 아직 근거가 없다.\n- sedation군 표본이 작아(n=10) 번니 부리토와 sedation 간 영상 품질 차이에 대한 통계적 비교가 이루어지지 않았다.\n- Propofol 단독 유도 시의 혈압 저하가 심질환이 있는 토끼나 다른 소동물에서도 동일하게 나타나는지, 실제 심초음파 판독 정확도에 영향을 주는지는 아직 알 수 없다."}, {"slug": "spinal-imaging", "title": "척추·척수 영상", "synthesis": "### 척수를 압박하는 낭성 병변의 감별진단\n만성 진행성 무통성 paraparesis를 보인 4세 Golden Retriever에서 MRI로 흉수를 압박하는 eccentric cystic lesion이 확인되어 척수 감압·병변 절제를 시행한 증례에서, 신경병리 검사 결과 전형적 arachnoid diverticulum/cyst가 아니라 dural·arachnoid의 hypertrophic calcifying change와 lymphoplasmacytic·neutrophilic 침윤을 동반한 염증성 meningoproliferative spinal cord disorder로 확인되었다 ([[papers/2026-42725102-spinal-proliferative-meningitis-arachnoid-diverticulum|Hajek 2026]]; 증례보고, n=1). 저자들은 개에서 첫 보고 사례라고 명시했다 — 단일 증례에 근거한 제한적 근거로, MRI 신호 특성만으로 이 병태와 전형적 arachnoid diverticulum을 감별할 수 있는지는 아직 알 수 없다.\n\n### 종양의 perineural spread를 통한 척수 침범\nFeline injection-site sarcoma(FISS) 유사 fibrosarcoma를 sciatic nerve 인근에서 불완전 절제·방사선치료한 고양이가 원발 부위 재발 없이 방사선치료 9개월 후 진행성 파라파레시스·배변·배뇨 이상으로 내원한 증례에서, MRI로 L5~sacrum에 걸친 대형 조영증강 extradural spinal lesion(intramedullary invasion 의심, lumbosacral nerve root 비후 동반)이 확인되었고 조직검사에서 원발 종양과 유사한 저분화 sarcoma로 확진되었다 ([[papers/2026-42724435-fiss-sarcoma-spinal-cord-invasion-cat|Pope 2026]]; 증례보고, n=1). 저자들은 sciatic nerve를 따른 perineural invasion을 통한 척수 침범을 생물학적으로 타당한 기전으로 제시했다 — 단일 증례에 근거한 제한적 근거.", "related_papers": ["흉수 압박성 낭성 병변이 염증성 meningoproliferative disorder로 확인된 첫 증례 (증례보고, n=1)", "FISS 유사 sarcoma의 perineural spread를 통한 척수 침범 첫 증례 (증례보고, n=1)"], "paper_count": 2, "conflicting_evidence": "", "open_questions": "- 척수를 압박하는 낭성 병변에서 염증성 meningoproliferative disorder와 전형적 arachnoid diverticulum/cyst를 MRI만으로 감별할 수 있는 특징적 소견이 있는지는 아직 근거가 없다.\n- 말초신경 인근에 발생한 연부조직 육종에서 perineural spread를 통한 척수 침범의 발생 빈도와, 이를 조기에 선별할 수 있는 영상 감시 프로토콜(주기, MRI 범위)은 확립되어 있지 않다."}, {"slug": "trauma-forensic-imaging", "title": "외상·법수의학 영상", "synthesis": "동물 학대가 의심되는 사례에서 영상진단은 은폐된 손상을 객관적으로 문서화하는 핵심 도구다. 비엔나 수의과대학의 10년간 자료(2014-2023, 11,689마리 중 83례 선별)에 따르면, fracture와 ballistic trauma(총상)가 종을 불문하고 가장 흔한 학대 관련 손상이었으며, 실제 학대 사례 확인에는 radiography와 CT가 사용된 반면 ultrasound와 MRI는 전혀 활용되지 않았다 ([[papers/2026-42531994-animal-abuse-imaging-findings|Pietras 2026]]; 후향적 연구, n=83). radiography는 전 종에서 효과적인 1차 선별검사였고, CT는 특히 조류와 파충류처럼 해부학적 구조가 복잡한 종에서 진단적 가치가 컸다 ([[papers/2026-42531994-animal-abuse-imaging-findings|Pietras 2026]]; 후향적 연구, n=83). 이는 단일기관 자료에 근거한 제한적 근거이며, ultrasound와 MRI의 역할에 대해서는 이 연구가 답하지 못한다.\n\n### 대규모 방임 현장에서의 개체수 산정과 영상\n대규모 동물 방임(1256마리 규모)이 발견된 현장에서는 전체 사체 계수가 불가능해, 온전한 사체 직접 계수와 분리 두개골 계수를 결합한 skull-based minimum number of individuals(MNI) 접근법이 사용되었다. 대표 22개체(사체 16, 두개골 6)에 대한 postmortem radiography를 포함한 상세 감정에서, 분리 두개골 6개 중 3개는 외상성 골절·scavenging 천공이, 2개는 품종 특유의 정상 개방 fontanelle이 확인되어 방사선검사가 외상과 정상 변이를 감별하는 핵심 도구로 쓰였다 ([[papers/2026-42738595-mni-forensic-starvation-scene|Kim 2026]]; 증례군, n=22). Body condition score 평가가 가능했던 5구는 모두 중증~극심한 마름을 보였다.", "related_papers": ["10년간 학대 의심 사례 83건 분석, radiography와 CT가 주요 진단 도구였고 ultrasound·MRI는 미사용 (후향적 연구, n=83)", "대규모 방임 현장에서 postmortem radiography 포함 skull-based MNI 감정 워크플로우 (증례군, n=22)"], "paper_count": 2, "conflicting_evidence": "", "open_questions": "- ultrasound와 MRI가 법수의학적 외상 평가(연부조직 손상, 두개내 출혈 등)에 기여할 수 있는지는 아직 근거가 없다.\n- 단일기관 자료 이므로 지역·의뢰 경향에 따라 손상 유형 분포가 다른 지역에서도 동일하게 재현되는지 확인이 필요하다.\n- Skull-based MNI 접근법과 postmortem radiography 조합이 다른 규모·종의 대량 방임/학대 현장에도 일반화되는지는 단일 사례로는 확인할 수 없다."}, {"slug": "urogenital-imaging", "title": "비뇨생식기 영상", "synthesis": "### Hydrocolpos·vaginal atresia 진단 워크플로우\n중성화·난산 병력이 있는 암컷 개에서 지속적 stranguria와 골반강 내 관상(tubular) 연부조직 병변이 나타난 증례에서, plain radiography로 방광·결장 전위를 먼저 확인한 뒤 초음파가 결론을 내리지 못하자 CT로 요도·결장을 압박하는 tubular hypodense structure를 확인해 hydrocolpos(vaginal atresia에 의한)로 진단했고, vaginoscopy와 retrograde cystography로 폐쇄 부위를 국소화했다 ([[papers/2026-42757221-hydrocolpos-vaginal-atresia-dog|Leber 2026]]; 증례보고, n=1). 저자들은 병력상 외상성 기원의 이차성 vaginal atresia로 추정했다 — 단일 증례에 근거한 제한적 근거.\n\n### 자궁 질환의 정량 초음파 평가\nDiestrus기 건강한 개 15마리(대조군)와 cystic endometrial hyperplasia-pyometra(CEH-P) complex를 가진 개 34마리(연구군)를 대상으로 한 전향적 연구에서, B-mode·Doppler 초음파에 더해 2D shear wave elastography(2D-SWE)를 시행한 결과 CEH-P군의 uterine artery waveform에서 저항 패턴 감소와 notch가 관찰되었고, 자궁벽 탄성도가 대조군보다 유의하게 높았다(p<0.001) ([[papers/2026-42759150-2d-swe-elastography-pyometra-uterus-liver|Mahzunlar 2026]]; 전향적 연구, n=49). ROC 분석에서 높은 민감도·특이도를 보여, 2D-SWE가 기존 B-mode·Doppler 초음파에 추가할 수 있는 비침습적 정량 도구가 될 가능성을 시사했다. 다만 초록에는 구체적 elasticity 수치(kPa)나 ROC AUC 값이 제시되지 않았고, 대조군 표본(15마리)이 크지 않아 cut-off 값의 임상 일반화에는 추가 검증이 필요하다. 이 연구는 간 탄성도·ALT/ALP 비율을 통한 CEH-P의 전신적(간) 영향 평가도 함께 다뤘다 (상세는 [[topics/abdominal-imaging]] 참고).", "related_papers": ["2D-SWE로 CEH-P 개의 자궁벽 탄성도 상승 확인, 간 탄성도로 전신 영향도 평가 (전향적 연구, n=49)", "외상 의심 vaginal atresia에 의한 hydrocolpos, CT·vaginoscopy·retrograde cystography로 진단 (증례보고, n=1)"], "paper_count": 2, "conflicting_evidence": "", "open_questions": "- 2D-SWE로 확인된 자궁벽 탄성도 상승의 구체적 cut-off 값과 진단 정확도(민감도·특이도)는 더 큰 코호트에서 검증이 필요하다.\n- 정상 주기(estrus/anestrus 등) 단계별 자궁벽 탄성도 기준값이 아직 확립되지 않아, diestrus 외 시기와의 비교는 이 연구만으로는 알 수 없다.\n- Hydrocolpos·vaginal atresia의 전형적 CT·초음파 소견과 감별진단(imperforate hymen, segmental vaginal aplasia 등) 빈도는 증례 축적이 더 필요하다."}, {"slug": "thoracic-imaging", "title": "흉부 영상", "synthesis": "### 정상 해부 참고자료\n성체 고양이 10마리를 이용해 흉복부 단면 해부와 조영증강 CT·3D 재구성을 상호 대조한 atlas 연구는 고양이 흉부 CT 판독과 수술 계획을 위한 정상 해부 참고자료를 제공했다. 흉곽 골격, 심장, 주요 혈관 등 주요 구조가 해부학적 절편과 CT 영상 간에 모두 식별·대조되었고, 조영증강은 특히 혈관 해부의 시인성을 크게 향상시켰다 ([[papers/2026-42710191-ct-atlas-feline-thorax-abdomen|Abdelmohsen 2026]]; 실험 연구, n=10 — 복부 소견은 [[topics/abdominal-imaging]] 참고). 병적 상태에서의 적용 가능성이나 품종·연령·체형에 따른 변이는 다루지 않아, 정상 기준 참고자료로서의 가치에 국한된다.", "related_papers": ["고양이 흉부·복부 CT-해부 대조 atlas (실험 연구, n=10)"], "paper_count": 1, "conflicting_evidence": "", "open_questions": "- 이 atlas가 실제 흉부 병변(폐 종양, 종격 병변 등) 판독 정확도를 개선하는지는 별도 검증이 필요하다."}];

  const PAGE_SIZE = 20;
  const STAR_KEY = "vetwiki-read-later";

  // 필터 정의: [논문 데이터의 필드, 드롭다운 제목, 보기 좋은 이름표]
  const TOPIC_NAMES = Object.fromEntries(allTopics.map(t => [t.slug, t.title]));
  const FILTERS = [
    { key: "topics", label: "주제", names: TOPIC_NAMES },
    { key: "modality", label: "영상 기법", names: {
        radiography: "방사선", CT: "CT", MRI: "MRI", ultrasound: "초음파",
        echocardiography: "심초음파", fluoroscopy: "투시", "nuclear-medicine": "핵의학",
        "contrast-study": "조영검사", interventional: "중재" } },
    { key: "system", label: "계통", names: {
        neuro: "신경", spine: "척추", "head-neck": "두경부", dental: "치과", thorax: "흉부",
        cardiovascular: "심혈관", abdomen: "복부", hepatobiliary: "간담도",
        gastrointestinal: "소화기", urogenital: "비뇨생식", endocrine: "내분비",
        musculoskeletal: "근골격", oncology: "종양", trauma: "외상",
        technique: "촬영 기법", "sedation-restraint": "진정·보정", AI: "AI" } },
    { key: "species", label: "종", names: { dog: "개", cat: "고양이", rabbit: "토끼" } },
    { key: "study_type", label: "연구 유형", names: {} },
  ];

  const state = { query: "", filters: {}, starOnly: false, sort: "added", shown: PAGE_SIZE, open: new Set() };

  // ── 나중에 볼 논문 (이 브라우저에 저장) ──
  function loadStars() {
    try { return new Set(JSON.parse(localStorage.getItem(STAR_KEY) || "[]")); }
    catch (e) { return new Set(); }
  }
  let stars = loadStars();
  function saveStars() {
    try { localStorage.setItem(STAR_KEY, JSON.stringify([...stars])); } catch (e) {}
  }

  // ── 도우미 ──
  function esc(text) {
    return String(text ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function asList(v) { return Array.isArray(v) ? v : (v ? [v] : []); }
  function shortJournal(j) { return (j || "").split(" : ")[0]; }
  function nameOf(filter, value) { return filter.names[value] || value; }

  document.getElementById("mastMeta").textContent =
    allPapers.length > 0
      ? `총 ${allPapers.length}편 수록 · 주제 ${allTopics.length}개 · 최근 갱신 ${allPapers[0].added_on || ""}`
      : "아직 수록된 논문이 없습니다";

  // ── 필터 드롭다운 만들기 (실제 데이터에 있는 값만, 논문 수와 함께) ──
  function buildFilters() {
    const grid = document.getElementById("filterGrid");
    grid.innerHTML = "";
    FILTERS.forEach(f => {
      const counts = {};
      allPapers.forEach(p => asList(p[f.key]).forEach(v => { counts[v] = (counts[v] || 0) + 1; }));
      const values = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      if (values.length === 0) return;
      const sel = document.createElement("select");
      sel.setAttribute("aria-label", f.label);
      sel.innerHTML = `<option value="">${f.label}: 전체</option>` +
        values.map(v => `<option value="${esc(v)}">${esc(nameOf(f, v))} (${counts[v]})</option>`).join("");
      sel.value = state.filters[f.key] || "";
      sel.classList.toggle("on", !!sel.value);
      sel.addEventListener("change", () => {
        state.filters[f.key] = sel.value;
        sel.classList.toggle("on", !!sel.value);
        state.shown = PAGE_SIZE;
        render();
      });
      grid.appendChild(sel);
    });
  }

  function updateStarButton() {
    const btn = document.getElementById("starFilter");
    btn.textContent = `★ 나중에 볼 논문 (${stars.size})`;
    btn.classList.toggle("on", state.starOnly);
  }

  // ── 필터링·정렬 ──
  function filtered() {
    const q = state.query;
    let list = allPapers.filter(p => {
      for (const f of FILTERS) {
        const want = state.filters[f.key];
        if (want && !asList(p[f.key]).includes(want)) return false;
      }
      if (state.starOnly && !stars.has(p.pmid)) return false;
      if (!q) return true;
      return [p.title, p.journal, p.summary_ko, p.summary_en, p.clinical_takeaway_ko,
              ...(p.tags || []), ...(p.authors || [])]
        .some(t => (t || "").toLowerCase().includes(q));
    });
    const by = {
      added: (a, b) => (b.added_on || "").localeCompare(a.added_on || "") || b.pmid.localeCompare(a.pmid),
      year: (a, b) => (b.year || "").localeCompare(a.year || "") || (b.added_on || "").localeCompare(a.added_on || ""),
      title: (a, b) => (a.title || "").localeCompare(b.title || ""),
    };
    return list.sort(by[state.sort]);
  }

  function entryHtml(p) {
    const starred = stars.has(p.pmid);
    const isOpen = state.open.has(p.pmid);
    const badges =
      (p.study_type ? `<span class="study-badge">${esc(p.study_type)}${p.sample_size ? `, n=${esc(p.sample_size)}` : ""}</span>` : "") +
      (p.evidence_basis === "fulltext" ? `<span class="study-badge fulltext">전문 검토</span>` : "");
    return `
      <article class="entry${isOpen ? " open" : ""}" data-pmid="${esc(p.pmid)}">
        <div class="entry-head">
          <div class="entry-main">
            <div class="entry-meta">${esc(shortJournal(p.journal))} · ${esc(p.year)}${badges}</div>
            <h2><button class="entry-toggle" data-action="toggle" title="눌러서 요약 펼치기">${esc(p.title)}</button></h2>
            ${p.clinical_takeaway_ko ? `<div class="takeaway">${esc(p.clinical_takeaway_ko)}</div>` : ""}
            <div class="entry-detail">
              <div class="entry-meta">${esc((p.authors || []).join(", "))}</div>
              ${p.summary_ko ? `<div class="summary-ko">${esc(p.summary_ko)}</div>` : ""}
              ${p.summary_en ? `<div class="summary-en">${esc(p.summary_en)}</div>` : ""}
              <div class="entry-footer">
                <div class="tags">${(p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
                <a class="entry-link" href="${esc(p.url)}" target="_blank" rel="noopener">PubMed에서 보기</a>
              </div>
            </div>
          </div>
          <button class="star-btn${starred ? " on" : ""}" data-action="star"
            aria-label="${starred ? "나중에 볼 논문에서 빼기" : "나중에 볼 논문으로 표시"}">${starred ? "★" : "☆"}</button>
        </div>
      </article>`;
  }

  function render() {
    updateStarButton();
    const list = filtered();
    const shown = list.slice(0, state.shown);
    const listEl = document.getElementById("paperList");
    const empty = document.getElementById("empty");
    const more = document.getElementById("moreBtn");

    document.getElementById("resultCount").textContent =
      list.length === allPapers.length ? `${list.length}편` : `${allPapers.length}편 중 ${list.length}편`;

    empty.style.display = list.length === 0 ? "block" : "none";

    // 최근 등록순일 때는 등록 월별로 구분선을 넣습니다
    let html = "", lastMonth = null;
    shown.forEach(p => {
      if (state.sort === "added") {
        const m = (p.added_on || "").slice(0, 7);
        if (m && m !== lastMonth) {
          const [y, mo] = m.split("-");
          const n = list.filter(x => (x.added_on || "").startsWith(m)).length;
          html += `<div class="month-heading">${y}년 ${Number(mo)}월 등록 · ${n}편</div>`;
          lastMonth = m;
        }
      }
      html += entryHtml(p);
    });
    listEl.innerHTML = html;

    const remaining = list.length - shown.length;
    more.style.display = remaining > 0 ? "block" : "none";
    more.textContent = `더 보기 (${remaining}편 남음)`;
  }

  // ── 이벤트 ──
  document.getElementById("paperList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const pmid = btn.closest(".entry").dataset.pmid;
    if (btn.dataset.action === "toggle") {
      state.open.has(pmid) ? state.open.delete(pmid) : state.open.add(pmid);
      btn.closest(".entry").classList.toggle("open");
    } else if (btn.dataset.action === "star") {
      stars.has(pmid) ? stars.delete(pmid) : stars.add(pmid);
      saveStars();
      render();
    }
  });

  document.getElementById("searchBox").addEventListener("input", (e) => {
    state.query = e.target.value.trim().toLowerCase();
    state.shown = PAGE_SIZE;
    render();
  });
  document.getElementById("sortSelect").addEventListener("change", (e) => {
    state.sort = e.target.value;
    render();
  });
  document.getElementById("starFilter").addEventListener("click", () => {
    state.starOnly = !state.starOnly;
    state.shown = PAGE_SIZE;
    render();
  });
  document.getElementById("moreBtn").addEventListener("click", () => {
    state.shown += PAGE_SIZE;
    render();
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    state.query = ""; state.filters = {}; state.starOnly = false; state.shown = PAGE_SIZE;
    document.getElementById("searchBox").value = "";
    buildFilters();
    render();
  });

  // ── 보기 전환 (논문 / 주제) ──
  function showView(view) {
    document.querySelectorAll(".view-tab").forEach(b => b.classList.toggle("active", b.dataset.view === view));
    document.getElementById("papersView").style.display = view === "papers" ? "" : "none";
    document.getElementById("topicsView").style.display = view === "topics" ? "" : "none";
    if (view === "topics") renderTopics();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".view-tab").forEach(btn =>
    btn.addEventListener("click", () => showView(btn.dataset.view)));

  // ── 주제 탭 ──
  function isMeaningfulText(text) {
    if (!text) return false;
    const trimmed = text.trim();
    if (trimmed.length === 0) return false;
    return !/^[(（]?(아직\s*)?없음[)）]?$/.test(trimmed);
  }

  function mdToHtml(text) {
    // 가벼운 마크다운 변환: ### 소제목, **굵게**, [[위키 링크]], 목록, 줄바꿈
    return esc(text)
      .replace(/\[\[[^\]|]*\|([^\]]+)\]\]/g, "$1")
      .replace(/\[\[(?:[^\]]*\/)?([^\]]+)\]\]/g, "$1")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/^###\s+(.+)$/gm, '<h3 class="sub-heading">$1</h3>')
      .replace(/^-\s+(.+)$/gm, "• $1")
      .replace(/\n{2,}/g, "<br><br>")
      .replace(/\n/g, "<br>")
      .replace(/(<\/h3>)(<br>)+/g, "$1")
      .replace(/(<br>)+(<h3)/g, "$2");
  }

  function renderTopics() {
    const list = document.getElementById("topicsList");
    const empty = document.getElementById("topicsEmpty");
    if (allTopics.length === 0) {
      list.innerHTML = "";
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";
    list.innerHTML = allTopics.map(t => {
      const n = allPapers.filter(p => asList(p.topics).includes(t.slug)).length;
      return `
      <article class="topic-entry">
        <h2>${esc(t.title)}</h2>
        <div class="topic-count">관련 논문 ${n || t.paper_count}편</div>
        ${isMeaningfulText(t.synthesis) ? `<div class="topic-synthesis">${mdToHtml(t.synthesis)}</div>` : ""}
        ${isMeaningfulText(t.conflicting_evidence) ? `<div class="conflict-box"><strong>상충되는 근거</strong><br>${mdToHtml(t.conflicting_evidence)}</div>` : ""}
        ${isMeaningfulText(t.open_questions) ? `<div class="open-box"><strong>남은 질문</strong><br>${mdToHtml(t.open_questions)}</div>` : ""}
        ${n > 0 ? `<button class="topic-link-btn" data-topic="${esc(t.slug)}">이 주제의 논문 ${n}편 보기 →</button>` : ""}
      </article>`;
    }).join("");
  }

  document.getElementById("topicsList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-topic]");
    if (!btn) return;
    state.filters = { topics: btn.dataset.topic };
    state.query = ""; state.starOnly = false; state.shown = PAGE_SIZE;
    document.getElementById("searchBox").value = "";
    buildFilters();
    render();
    showView("papers");
  });

  buildFilters();
  render();
</script>

</body>
</html>
